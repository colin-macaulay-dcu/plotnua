  <g><circle cx="730" cy="200" r="15" fill="#1B1C1E" stroke="#B39272" stroke-width="1.5"/><text x="730" y="205.5" fill="#F2EBE0">3</text></g>
  <g><circle cx="750" cy="470" r="15" fill="#1B1C1E" stroke="#B39272" stroke-width="1.5"/><text x="750" y="475.5" fill="#F2EBE0">4</text></g>
</g>

