</g>

<!-- shelf, router, plant, towels -->
<g>
  <rect x="300" y="168" width="196" height="9" rx="2" fill="#6E5B49"/>
  <rect x="316" y="148" width="62" height="20" rx="4" fill="#E6E0D6"/>
  <circle cx="330" cy="158" r="2.2" fill="#7FA88A"/>
  <circle cx="340" cy="158" r="2.2" fill="#7FA88A"/>
  <path d="M322 148v-16M370 148v-16" stroke="#E6E0D6" stroke-width="3" stroke-linecap="round"/>
  <rect x="402" y="140" width="46" height="28" rx="3" fill="#C9BBA7"/>
  <rect x="402" y="128" width="46" height="13" rx="3" fill="#9E8C76"/>
  <path d="M468 168c-2-18 2-30 10-38M474 168c4-16 12-24 22-28M462 168c-8-12-14-18-24-20" stroke="#6F8B6F" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M456 168h30l-4 0" stroke="#6E5B49"/>
  <rect x="458" y="150" width="24" height="18" rx="3" fill="#A6754F"/>
</g>

<!-- network cable router -> unit -->
<path d="M366 177c0 30 4 60 20 90" stroke="#8C8F94" stroke-width="3" fill="none" stroke-linecap="round"/>

<!-- warm glow behind unit (heat being captured) -->
<ellipse cx="380" cy="380" rx="120" ry="110" fill="url(#warm)"/>

<!-- computing unit (generic, wall-mounted) -->
<g>
  <rect x="308" y="266" width="148" height="214" rx="14" fill="#1C1D1F" filter="url(#soft)" opacity=".55" transform="translate(8 14)"/>
  <rect x="308" y="266" width="148" height="214" rx="14" fill="url(#unit)"/>
  <rect x="308" y="266" width="148" height="214" rx="14" fill="none" stroke="#97785A" stroke-opacity=".55" stroke-width="1.5"/>
