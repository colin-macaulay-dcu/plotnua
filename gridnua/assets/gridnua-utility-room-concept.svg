<path d="M332 480c0 28-8 44-14 58" stroke="#202124" stroke-width="5" fill="none" stroke-linecap="round"/>
<rect x="298" y="528" width="40" height="22" rx="4" fill="#E6E0D6"/>
<rect x="308" y="535" width="6" height="9" rx="1" fill="#9C978F"/><rect x="322" y="535" width="6" height="9" rx="1" fill="#9C978F"/>

<!-- insulated flow / return pipes unit -> cylinder coil -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M456 330H520" stroke="#323438" stroke-width="18"/>
  <path d="M456 330H520" stroke="#C47E4E" stroke-width="2" stroke-dasharray="2 12" opacity=".8"/>
  <path d="M456 420H520" stroke="#323438" stroke-width="18"/>
  <path d="M456 420H520" stroke="#7E8A93" stroke-width="2" stroke-dasharray="2 12" opacity=".8"/>
</g>
<g fill="#26272A"><rect x="482" y="318" width="8" height="24" rx="2"/><rect x="482" y="408" width="8" height="24" rx="2"/></g>
<!-- faint heat shimmer -->
<g stroke="#E8A06F" stroke-width="2" fill="none" opacity=".35" stroke-linecap="round">
  <path d="M478 312c-5-8 5-12 0-20M496 312c-5-8 5-12 0-20"/>
</g>

<!-- hot-water cylinder -->
<g>
  <ellipse cx="610" cy="566" rx="104" ry="14" fill="#1E1D1B" opacity=".45"/>
  <rect x="520" y="150" width="180" height="404" rx="12" fill="url(#cyl)"/>
  <ellipse cx="610" cy="152" rx="90" ry="20" fill="url(#cyltop)"/>
  <ellipse cx="610" cy="552" rx="90" ry="12" fill="#B3AB9E"/>
  <rect x="520" y="300" width="180" height="2" fill="#000" opacity=".06"/>
  <!-- coil connections -->
  <rect x="512" y="320" width="14" height="20" rx="3" fill="url(#copper)"/>
  <rect x="512" y="410" width="14" height="20" rx="3" fill="url(#copper)"/>
  <!-- data plate -->
