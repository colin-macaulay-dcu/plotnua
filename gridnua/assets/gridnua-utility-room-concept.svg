<g fill="none" stroke="#B07648" stroke-width="9" stroke-linecap="round">
  <path d="M584 140V0"/><path d="M636 140V60c0-20 10-30 30-30h294"/>
</g>
<path d="M556 520c-40 0-40 20-40 40" stroke="#B07648" stroke-width="9" fill="none" stroke-linecap="round"/>

