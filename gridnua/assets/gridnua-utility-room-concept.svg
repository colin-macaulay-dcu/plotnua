<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="t d">
<title id="t">Conceptual illustration: a compact computing unit beside a hot-water cylinder in a utility room</title>
<desc id="d">A modern utility room. On the wall, a compact dark computing unit is connected by two insulated pipes to a white hot-water cylinder, so the unit's heat could warm the stored water. A power cable runs to a wall socket and a network cable to a router on a shelf. The cylinder's existing immersion heater remains. Conceptual only: not a real installation or a real product.</desc>
<!-- GridNua · conceptual illustration · vector, authored as code with AI assistance (Claude), 29 Oct 2026.
     No reference photographs, no third-party product designs, no real property. -->
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4B4743"/><stop offset="1" stop-color="#413E3A"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#36332F"/><stop offset="1" stop-color="#2A2826"/></linearGradient>
  <radialGradient id="daylight" cx=".18" cy=".22" r=".75"><stop offset="0" stop-color="#F7E7CF" stop-opacity=".20"/><stop offset="1" stop-color="#F7E7CF" stop-opacity="0"/></radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9D3D6"/><stop offset=".6" stop-color="#8F9DA2"/><stop offset="1" stop-color="#6E7B80"/></linearGradient>
  <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#BDB5A8"/><stop offset=".22" stop-color="#ECE6DB"/><stop offset=".55" stop-color="#F4EFE6"/><stop offset=".85" stop-color="#D6CEC1"/><stop offset="1" stop-color="#ADA598"/></linearGradient>
  <linearGradient id="cyltop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F3EC"/><stop offset="1" stop-color="#DCD4C8"/></linearGradient>
  <linearGradient id="unit" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#232427"/><stop offset=".5" stop-color="#2E3034"/><stop offset="1" stop-color="#202124"/></linearGradient>
  <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D19A6C"/><stop offset=".5" stop-color="#B07648"/><stop offset="1" stop-color="#8A5A36"/></linearGradient>
  <linearGradient id="lag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3D3F43"/><stop offset="1" stop-color="#2A2B2E"/></linearGradient>
  <radialGradient id="warm" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#E8A06F" stop-opacity=".30"/><stop offset="1" stop-color="#E8A06F" stop-opacity="0"/></radialGradient>
  <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D9D3C9"/><stop offset=".5" stop-color="#EDE8DF"/><stop offset="1" stop-color="#CFC8BD"/></linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>

<!-- room -->
<rect width="960" height="560" fill="url(#wall)"/>
<rect width="960" height="560" fill="url(#daylight)"/>
<polygon points="0,560 960,560 960,760 0,760" fill="url(#floor)"/>
<g stroke="#4A4642" stroke-width="1" opacity=".55">
  <path d="M0 610H960M0 672H960"/>
  <path d="M120 560 40 760M300 560 260 760M480 560 480 760M660 560 700 760M840 560 920 760"/>
</g>
<rect y="552" width="960" height="10" fill="#36332F"/>

<!-- window with daylight -->
<g>
  <rect x="64" y="84" width="200" height="232" rx="6" fill="#2F2D2A"/>
  <rect x="76" y="96" width="176" height="208" rx="3" fill="url(#glass)"/>
