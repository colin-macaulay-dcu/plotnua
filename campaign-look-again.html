<title>LOOK AGAIN — Hidden Cars | PlotNua</title>

<!--
  ===========================================================================
  PLOTNUA — LOOK AGAIN · CAMPAIGN 01 · HIDDEN CARS
  ===========================================================================

  WHAT THIS IS
    A campaign presentation surface. It is NOT part of the frozen DISC-022
    journey. It links INTO that journey and changes nothing inside it.

  PHOTOGRAPHY — REPOSITORY ORIGINALS ONLY
    Every photograph below is an existing DISC-022 asset already served by
    discovery-hidden-cars.html. Nothing was generated, recreated or
    substituted. The three files, with the alt text carried across from the
    live Discovery so the description stays true to the frozen source:

      assets/img/458728c46951cf14.jpg   ordinary street, cars at the kerb
      assets/img/41874366bc189197.jpg   the same frontage, evening
      assets/img/9aa6c362d5486001.jpg   the platform lift, chamber open

    The originals are never written to. Every adaptation here is CSS crop
    (object-fit / object-position) over the untouched file.

  TRUTH BOUNDARY — READ BEFORE EDITING
    PlotNua has NO verified Hidden Cars provider network. Premier Lifts has
    been contacted and is NOT a partner. So this surface must never carry:
    trusted/approved/verified providers, provider availability, installation
    availability, partnership claims, pricing, income figures or urgency.
    The supporting sequence is journey language only, and CAMPAIGN.steps
    below is the single place it is defined.

  REUSE — CAMPAIGN 02 / 03
    Swap the CAMPAIGN object. Nothing else should need to change: the beats,
    the marker, the three formats and the attribution all read from it.
  ===========================================================================
-->

<style>
:root{
  --brand-green:#1F3B2E;
  --brand-ivory:#F2EFE6;
  --brand-sage:#8FAF8A;
  --ink:#16261D;
  --paper:#FFFFFF;
  --rule:rgba(31,59,46,.16);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#E7E3D8;
  color:var(--ink);
  font-family:'Work Sans',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* ---- format chooser · presentation chrome, never captured --------------- */
.pnc-bar{
  position:sticky;top:0;z-index:50;
  display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;
  padding:.7rem 1rem;
  background:var(--brand-green);color:var(--brand-ivory);
  font-size:.8rem;letter-spacing:.02em;
}
.pnc-bar strong{font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.72rem}
.pnc-bar nav{display:flex;gap:.4rem;margin-left:auto;flex-wrap:wrap}
.pnc-bar a{
  color:var(--brand-ivory);text-decoration:none;
  border:1px solid rgba(242,239,230,.35);border-radius:999px;
  padding:.28rem .8rem;font-size:.75rem;
}
.pnc-bar a[aria-current="true"]{background:var(--brand-ivory);color:var(--brand-green);border-color:var(--brand-ivory);font-weight:600}
@media print{.pnc-bar{display:none}}

.pnc-stage{
  display:flex;flex-direction:column;align-items:center;
  gap:1.5rem;padding:1.5rem 1rem 3.5rem;
}
.pnc-note{
  max-width:46rem;font-size:.8rem;line-height:1.55;color:#4A5A50;text-align:center;
}

/* ---- the capture frame ------------------------------------------------- */
.pnf{
  position:relative;overflow:hidden;
  width:min(100%,var(--frame-w));
  aspect-ratio:var(--frame-ar);
  background:var(--brand-green);
  box-shadow:0 18px 50px rgba(22,38,29,.18);
  display:flex;flex-direction:column;
}
[data-format="4x5"]  {--frame-ar:4/5;   --frame-w:540px}
[data-format="9x16"] {--frame-ar:9/16;  --frame-w:430px}
[data-format="16x9"] {--frame-ar:16/9;  --frame-w:1000px}
[data-format="triptych"]{--frame-ar:16/9; --frame-w:1180px}

/* photography dominates: the image block takes the lion's share */
.pnf-media{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#111}
.pnf-media img{
  width:100%;height:100%;display:block;
  object-fit:cover;object-position:var(--focal,center 62%);
}
.pnf-media::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(10,20,15,.34) 0%,rgba(10,20,15,0) 34%,rgba(10,20,15,0) 58%,rgba(10,20,15,.42) 100%);
}

/* beat label, top-left, quiet */
.pnf-kicker{
  position:absolute;z-index:3;top:1.1rem;left:1.2rem;right:1.2rem;
  font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.86);font-weight:500;
  text-shadow:0 1px 10px rgba(0,0,0,.4);
}

/* the interruption word */
.pnf-shout{
  position:absolute;z-index:4;left:0;right:0;top:40%;transform:translateY(-50%);
  text-align:center;color:#fff;
  font-family:'Work Sans',sans-serif;font-weight:600;
  font-size:clamp(1.9rem,8.2cqw,4.6rem);
  letter-spacing:.005em;
  text-shadow:0 2px 26px rgba(0,0,0,.42);
}

/* ---- THE PLOTNUA POSSIBILITY MARKER ------------------------------------
   Four open corner brackets. No fill, no closed rectangle, no crosshair,
   no pin, no pulse. It points; it does not label. Secondary to the photo
   at every size — that is the whole design constraint.                    */
.pnf-marker{
  position:absolute;z-index:3;
  left:var(--mk-l);top:var(--mk-t);width:var(--mk-w);height:var(--mk-h);
  pointer-events:none;
}
.pnf-marker i{
  position:absolute;width:var(--mk-arm,17%);height:var(--mk-arm-v,22%);
  border:0 solid rgba(255,255,255,.94);
  filter:drop-shadow(0 1px 6px rgba(0,0,0,.42));
}
.pnf-marker i:nth-child(1){top:0;left:0;border-top-width:2px;border-left-width:2px}
.pnf-marker i:nth-child(2){top:0;right:0;border-top-width:2px;border-right-width:2px}
.pnf-marker i:nth-child(3){bottom:0;left:0;border-bottom-width:2px;border-left-width:2px}
.pnf-marker i:nth-child(4){bottom:0;right:0;border-bottom-width:2px;border-right-width:2px}

/* ---- the ivory message band -------------------------------------------- */
.pnf-band{
  flex:0 0 auto;background:var(--brand-ivory);
  padding:clamp(.85rem,2.6cqw,1.5rem) clamp(1rem,3.2cqw,1.9rem);
  display:flex;gap:1.3rem;align-items:center;
}
.pnf-band-main{min-width:0;flex:1 1 auto}
.pnf-line{
  font-family:'Fraunces',Georgia,serif;
  font-weight:600;line-height:1.1;color:var(--brand-green);
  font-size:clamp(1.15rem,4.1cqw,2.05rem);
  margin:0;letter-spacing:-.01em;
}
.pnf-line em{font-style:normal;display:block}
.pnf-sub{
  margin:.45rem 0 0;font-size:clamp(.78rem,1.9cqw,1rem);
  line-height:1.42;color:#3D5145;
}
.pnf-sub-quiet{font-size:clamp(.72rem,1.6cqw,.86rem);color:#54685C;margin-top:.3rem}

.pnf-cta{
  display:inline-flex;align-items:center;gap:.55rem;
  margin-top:.9rem;
  background:var(--brand-green);color:var(--brand-ivory);
  text-decoration:none;font-weight:600;
  font-size:clamp(.82rem,1.9cqw,1rem);
  padding:.72em 1.35em;border-radius:6px;
  transition:background .18s ease;
}
.pnf-cta:hover{background:#16301f}
.pnf-cta:focus-visible{outline:3px solid var(--brand-sage);outline-offset:3px}
.pnf-cta span{display:inline-block;transition:transform .18s ease}
.pnf-cta:hover span{transform:translateX(3px)}

/* the three journey steps — journey language only, no provider claims */
.pnf-steps{
  flex:0 0 auto;display:flex;gap:1.15rem;
  padding-left:1.3rem;border-left:1px solid var(--rule);
}
.pnf-step{text-align:center;width:6.1rem}
.pnf-step svg{display:block;margin:0 auto .42rem;width:22px;height:22px;stroke:var(--brand-green);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pnf-step span{font-size:.7rem;line-height:1.3;color:#3D5145;display:block}
/* each label line is its own block, so the rendered text still reads as a
   sentence with real whitespace rather than two words jammed together */
.pnf-step span b{display:block;font-weight:inherit}

/* ---- the green footer -------------------------------------------------- */
.pnf-foot{
  flex:0 0 auto;background:var(--brand-green);color:var(--brand-ivory);
  padding:.7rem clamp(1rem,3.2cqw,1.9rem);
  display:flex;align-items:center;gap:.9rem;
  font-size:clamp(.66rem,1.5cqw,.82rem);line-height:1.35;
}
.pnf-foot img{width:22px;height:22px;flex:0 0 auto}
.pnf-wordmark{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.05em;letter-spacing:-.01em}
.pnf-foot-rule{width:1px;align-self:stretch;background:rgba(242,239,230,.28);flex:0 0 auto}
.pnf-foot p{margin:0;opacity:.92}

/* ---- format-specific behaviour ----------------------------------------- */
.pnf{container-type:inline-size}

/* portrait: the steps row moves under the copy, CTA stays prominent */
[data-format="4x5"] .pnf-band,
[data-format="9x16"] .pnf-band{flex-direction:column;align-items:stretch;gap:.85rem}
[data-format="4x5"] .pnf-steps,
[data-format="9x16"] .pnf-steps{
  padding-left:0;border-left:0;border-top:1px solid var(--rule);
  padding-top:.85rem;justify-content:space-between;gap:.5rem;
}
[data-format="4x5"] .pnf-step,
[data-format="9x16"] .pnf-step{width:auto;flex:1 1 0}

/* 9:16 gives the photograph even more room */
[data-format="9x16"] .pnf-media{flex-grow:1.5}

/* the triptych: three beats inside one 16:9 frame, as the concept showed */
.pnt{display:flex;flex-direction:column;height:100%}
.pnt-row{display:flex;flex:1 1 auto;min-height:0}
.pnt-cell{position:relative;flex:1 1 0;min-width:0;border-right:2px solid var(--brand-ivory);overflow:hidden}
.pnt-cell:last-child{border-right:0}
.pnt-cell img{width:100%;height:100%;object-fit:cover;object-position:var(--focal,center 62%);display:block}
.pnt-cell::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,20,15,.42) 0%,rgba(10,20,15,0) 30%)}
.pnt-cap{
  position:absolute;z-index:3;top:.7rem;left:.85rem;right:.85rem;
  font-size:.72rem;color:rgba(255,255,255,.9);letter-spacing:.02em;
  text-shadow:0 1px 8px rgba(0,0,0,.45);
}
.pnt-shout{
  position:absolute;z-index:4;left:0;right:0;top:34%;text-align:center;color:#fff;
  font-weight:600;font-size:clamp(1.2rem,3.2cqw,2.3rem);text-shadow:0 2px 24px rgba(0,0,0,.45);
}

@media (max-width:560px){
  .pnf-steps{display:none}
  [data-format="16x9"] .pnf-line,[data-format="triptych"] .pnf-line{font-size:1.1rem}
}
</style>
</head>
<body>

<div class="pnc-bar">
  <strong>LOOK AGAIN · Campaign 01 · Hidden Cars</strong>
  <nav id="pncNav"></nav>
</div>

<main class="pnc-stage" id="pncStage"></main>

<p class="pnc-note" id="pncNote"></p>

<script>
/* ===========================================================================
   THE CAMPAIGN OBJECT — the only thing a later campaign needs to replace.
   Campaign 02 (Driveway Income) and Campaign 03 (The Borrowed Garden) swap
   photographs, the three lines, the CTA, the destination and the id. The
   rendering, the marker, the three formats and the attribution are generic.
   =========================================================================== */
var CAMPAIGN = {
  id: 'look-again-hidden-cars',
  destination: 'discovery-hidden-cars.html',
  ctaLabel: 'Explore Hidden Cars',

  /* Journey language only. Deliberately NOT "find trusted Irish providers":
     PlotNua has no verified Hidden Cars provider network. */
  steps: [
    { label: "Explore\nwhat's possible", icon: 'home' },
    { label: 'Understand\nwhat to consider', icon: 'list' },
    { label: 'Check\nyour property', icon: 'sign' }
  ],

  brandLine: 'Your property may contain possibilities you have never considered.',
  supportLine: "PlotNua helps you understand what you'd need to consider first.",

  beats: [
    {
      key: 'recognition',
      kicker: 'The driveway you see.',
      img: 'assets/img/458728c46951cf14.jpg',
      alt: 'An ordinary evening on an Irish street: the family car on the driveway, others pushed out to the kerb.',
      focal: 'center 64%',
      line: 'No room for another car?',
      marker: false
    },
    {
      key: 'interruption',
      kicker: 'The possibility you might be missing.',
      img: 'assets/img/41874366bc189197.jpg',
      alt: 'The same Irish frontage in the evening, the driveway holding a single car.',
      focal: 'center 64%',
      shout: 'LOOK AGAIN.',
      line: 'LOOK AGAIN.',
      marker: true,
      /* Marker box, per format. Tuned to sit over the driveway bay — the
         overlooked area — never over the house or the street. */
      markerBox: {
        '4x5':      { l:'26%', t:'50%', w:'48%', h:'26%' },
        '9x16':     { l:'22%', t:'49%', w:'56%', h:'24%' },
        '16x9':     { l:'33%', t:'50%', w:'34%', h:'30%' },
        'triptych': { l:'30%', t:'48%', w:'40%', h:'30%' }
      }
    },
    {
      key: 'revelation',
      kicker: 'The extra space you could have.',
      img: 'assets/img/9aa6c362d5486001.jpg',
      alt: 'A car raised on a platform lift above an open chamber in the driveway of an Irish period house, a second car parked in the lit space below.',
      focal: 'center 56%',
      line: "Your property may have parking space you can't see yet.",
      marker: false,
      cta: true
    }
  ]
};

var FORMATS = [
  { id:'4x5',      label:'4:5 — feed' },
  { id:'9x16',     label:'9:16 — story' },
  { id:'16x9',     label:'16:9 — web' },
  { id:'triptych', label:'16:9 — triptych' }
];

var ICONS = {
  home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/>',
  list: '<rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 8.5h6M9 12h6M9 15.5h4"/>',
  sign: '<path d="M12 3v18"/><path d="M5 6.5h11l2.5 2.5L16 11.5H5z"/><path d="M19 14.5H8l-2.5 2.5L8 19.5h11z"/>'
};

/* ---- format selection -------------------------------------------------- */
function currentFormat(){
  var q = new URLSearchParams(location.search).get('format');
  for (var i=0;i<FORMATS.length;i++) if (FORMATS[i].id === q) return q;
  return '4x5';
}

/* ---- attribution ------------------------------------------------------ *
 * GA4 is already on this page under the same Cookiebot consent gate the
 * Discovery uses, so nothing new is introduced and nothing is collected
 * before consent. The link out carries UTMs so the Discovery visit is
 * attributable to this campaign in the SAME GA4 property.
 * No personal data. No new vendor. No cookie written by this page.        */
function track(name, params){
  try { if (typeof gtag === 'function') gtag('event', name, params || {}); } catch (e) {}
}

function destinationURL(fmt){
  var u = CAMPAIGN.destination;
  var p = new URLSearchParams({
    utm_source:   'look-again',
    utm_medium:   'campaign',
    utm_campaign: CAMPAIGN.id,
    utm_content:  fmt
  });
  /* carry a paid/placement source through if the ad platform supplied one */
  var incoming = new URLSearchParams(location.search);
  if (incoming.get('placement')) p.set('utm_term', incoming.get('placement'));
  return u + '?' + p.toString();
}

/* ---- rendering -------------------------------------------------------- */
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function stepsHTML(){
  return '<div class="pnf-steps">' + CAMPAIGN.steps.map(function(s){
    /* joined with a real space, not <br>, so the accessible and testable
       text of the step is the whole phrase */
    var lines = s.label.split('\n').map(function(t){ return '<b>' + esc(t) + '</b>'; }).join(' ');
    return '<div class="pnf-step">' +
           '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[s.icon] + '</svg>' +
           '<span>' + lines + '</span></div>';
  }).join('') + '</div>';
}

function markerHTML(beat, fmt){
  if (!beat.marker) return '';
  var b = beat.markerBox[fmt] || beat.markerBox['16x9'];
  return '<div class="pnf-marker" aria-hidden="true" style="--mk-l:' + b.l +
         ';--mk-t:' + b.t + ';--mk-w:' + b.w + ';--mk-h:' + b.h + '">' +
         '<i></i><i></i><i></i><i></i></div>';
}

function frameHTML(beat, fmt){
  var isLast = !!beat.cta;
  var html = '<section class="pnf" data-format="' + fmt + '" data-beat="' + beat.key + '">';

  html += '<div class="pnf-media">' +
            '<img src="' + beat.img + '" alt="' + esc(beat.alt) + '" ' +
              'style="--focal:' + beat.focal + '" ' +
              (beat.key === 'recognition' ? 'fetchpriority="high"' : 'loading="lazy"') +
              ' decoding="async">' +
            '<p class="pnf-kicker">' + esc(beat.kicker) + '</p>' +
            (beat.shout ? '<p class="pnf-shout">' + esc(beat.shout) + '</p>' : '') +
            markerHTML(beat, fmt) +
          '</div>';

  html += '<div class="pnf-band"><div class="pnf-band-main">' +
            '<p class="pnf-line">' + esc(beat.line) + '</p>' +
            (isLast ? '<p class="pnf-sub">' + esc(CAMPAIGN.supportLine) + '</p>' +
                      '<a class="pnf-cta" data-cta="1" href="' + destinationURL(fmt) + '">' +
                        esc(CAMPAIGN.ctaLabel) + ' <span aria-hidden="true">&rarr;</span></a>'
                    : '') +
          '</div>' + (isLast ? stepsHTML() : '') + '</div>';

  html += '<div class="pnf-foot">' +
            '<img src="assets/brand/plotnua-icon-transparent.svg" alt="" width="22" height="22">' +
            '<span class="pnf-wordmark">PlotNua</span>' +
            '<span class="pnf-foot-rule"></span>' +
            '<p>' + esc(CAMPAIGN.brandLine) + '</p>' +
          '</div>';

  return html + '</section>';
}

function triptychHTML(fmt){
  var cells = CAMPAIGN.beats.map(function(b){
    return '<div class="pnt-cell">' +
      '<img src="' + b.img + '" alt="' + esc(b.alt) + '" style="--focal:' + b.focal + '" decoding="async">' +
      '<p class="pnt-cap">' + esc(b.kicker) + '</p>' +
      (b.shout ? '<p class="pnt-shout">' + esc(b.shout) + '</p>' : '') +
      markerHTML(b, fmt) + '</div>';
  }).join('');

  var last = CAMPAIGN.beats[CAMPAIGN.beats.length - 1];

  return '<section class="pnf" data-format="' + fmt + '" data-beat="triptych"><div class="pnt">' +
    '<div class="pnt-row">' + cells + '</div>' +
    '<div class="pnf-band"><div class="pnf-band-main">' +
      '<p class="pnf-line">' + esc(CAMPAIGN.beats[0].line) + '<em>LOOK AGAIN.</em></p>' +
      '<p class="pnf-sub">' + esc(last.line) + '</p>' +
      '<p class="pnf-sub pnf-sub-quiet">' + esc(CAMPAIGN.supportLine) + '</p>' +
    '</div>' + stepsHTML() +
    '<a class="pnf-cta" data-cta="1" href="' + destinationURL(fmt) + '" style="margin-top:0">' +
      esc(CAMPAIGN.ctaLabel) + ' <span aria-hidden="true">&rarr;</span></a>' +
    '</div>' +
    '<div class="pnf-foot">' +
      '<img src="assets/brand/plotnua-icon-transparent.svg" alt="" width="22" height="22">' +
      '<span class="pnf-wordmark">PlotNua</span>' +
      '<span class="pnf-foot-rule"></span>' +
      '<p>' + esc(CAMPAIGN.brandLine) + '</p>' +
    '</div></div></section>';
}

function render(){
  var fmt = currentFormat();

  document.getElementById('pncNav').innerHTML = FORMATS.map(function(f){
    return '<a href="?format=' + f.id + '"' + (f.id === fmt ? ' aria-current="true"' : '') +
           '>' + esc(f.label) + '</a>';
  }).join('');

  document.getElementById('pncStage').innerHTML =
    (fmt === 'triptych')
      ? triptychHTML(fmt)
      : CAMPAIGN.beats.map(function(b){ return frameHTML(b, fmt); }).join('');

  document.getElementById('pncNote').textContent =
    fmt === 'triptych'
      ? 'One 16:9 frame carrying all three beats — for web, share and PR.'
      : 'Three frames at ' + fmt.replace('x', ':') + '. Capture each frame on its own; together they are one campaign, in order.';

  track('campaign_view', {
    campaign_id: CAMPAIGN.id,
    campaign_format: fmt,
    campaign_beats: (fmt === 'triptych' ? 1 : CAMPAIGN.beats.length)
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-cta="1"]'), function(a){
    a.addEventListener('click', function(){
      track('campaign_cta_click', {
        campaign_id: CAMPAIGN.id,
        campaign_format: fmt,
        campaign_destination: CAMPAIGN.destination
      });
    });
  });
}

render();
window.addEventListener('popstate', render);
</script>
</body>
</html>
