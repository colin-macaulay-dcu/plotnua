# The Borrowed Garden noticeboard publishing (release candidate, 4 Nov 2026). OFF until the founder's launch: runs only
# when the repository variable GARDEN_PUBLISH_ENABLED or flags.json garden_publish_enabled is true. Publishes the
# founder's approved, unexpired listings (public fields only) from PlotArt Studio to borrowed-garden-board.html.
# Each run: atlas-tools/plotnua-garden-publish.py takes the approved listings from PlotArt Studio, rebuilds the page,
# refuses unless only the snapshot and the page changed and the guards pass, then releases through the gate.

name: Borrowed Garden noticeboard publishing

on:
  schedule:
    - cron: '8,38 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: read       # promote-after-gate.sh reads gate results; nothing is dispatched any more (Stage 1)

# Own lock (2 Nov 2026): runs started on approval must not be cancelled by a queued PlotArt run sharing a lock. If the
# PlotArt pipeline moves main at the same moment, the push is refused (never forced) and the run retries once below.
concurrency:
  group: plotnua-garden-publish
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}   # reads gate results and requests Pages builds (the gate is no longer dispatched)

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: release-automation   # holds the release App key; deployment branches: main only
      deployment: false          # the key is available, no deployment record is created
    outputs:
      branch: ${{ steps.pub.outputs.branch }}
      sha: ${{ steps.pub.outputs.sha }}
    timeout-minutes: 15   # the gated release is promoted by the job below, not waited for here
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The switch: atlas-tools/release/flags.json garden_publish_enabled (false until the noticeboard launch).
      - name: Is publishing switched on?
        id: on
        env:
          VAR: ${{ vars.GARDEN_PUBLISH_ENABLED }}
        run: |
          F=$(python3 -c 'import json; print(str(json.load(open("atlas-tools/release/flags.json")).get("garden_publish_enabled", False)).lower())' 2>/dev/null || echo false)
          if [ "$VAR" = "true" ] || [ "$F" = "true" ]; then echo "on=1" >> "$GITHUB_OUTPUT"; echo "publishing on"; else echo "publishing is switched off: nothing to do"; fi
      - name: Note where main is before publishing
        if: steps.on.outputs.on == '1'
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # A 1-hour token of the "PlotNua Release" GitHub App (Contents only, this repository only, no Workflows
      # permission), from the release-automation environment (main only). Used only to push release/auto/ branches,
      # so that the Image rights gate starts on a PUSH: the only gate main's required check counts (Stage 1, 10 Nov 2026).
      - name: Release push token (PlotNua Release App)
        if: steps.on.outputs.on == '1'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510   # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
      - name: Publish approved noticeboard listings (content-only, guarded, gated)
        id: pub
        if: steps.on.outputs.on == '1'
        env:
          RELEASE_PUSH_TOKEN: ${{ steps.app.outputs.token }}
          STUDIO_URL: ${{ secrets.STUDIO_URL }}
          STUDIO_PIPELINE_TOKEN: ${{ secrets.STUDIO_PIPELINE_TOKEN }}
          STUDIO_ACCESS_CLIENT_ID: ${{ secrets.STUDIO_ACCESS_CLIENT_ID }}
          STUDIO_ACCESS_CLIENT_SECRET: ${{ secrets.STUDIO_ACCESS_CLIENT_SECRET }}
        run: |
          set -uo pipefail
          python3 atlas-tools/plotnua-garden-publish.py --studio "$STUDIO_URL" --token "$STUDIO_PIPELINE_TOKEN" --push && exit 0
          echo "first attempt refused: retrying once on the latest main"
          sleep 20; git fetch -q origin main && git reset -q --hard origin/main
          python3 atlas-tools/plotnua-garden-publish.py --studio "$STUDIO_URL" --token "$STUDIO_PIPELINE_TOKEN" --push
      - name: Request the GitHub Pages build when main moved
        if: steps.on.outputs.on == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ steps.before.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          AFTER=$(git rev-parse origin/main)
          if [ "$AFTER" != "$BEFORE" ]; then
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds" > /dev/null
            echo "main moved ${BEFORE:0:7} -> ${AFTER:0:7}: Pages build requested"
          else
            echo "nothing published: no Pages build requested"
          fi

  # This job promotes the exact commit the publish job released, once its push-started gate has passed, through
  # promote.sh copied from main (fast-forward only, refused if main moved, live check, automatic rollback released the
  # same way). "Release to production" deliberately leaves release/auto/garden-* (and its rollbacks) to this job.
  promote:
    needs: publish
    if: ${{ needs.publish.outputs.sha != '' }}
    runs-on: ubuntu-latest
    environment:
      name: release-automation   # holds the release App key; deployment branches: main only
      deployment: false          # the key is available, no deployment record is created
    timeout-minutes: 60
    concurrency:
      group: production-site
      cancel-in-progress: false
    env:
      SHA: ${{ needs.publish.outputs.sha }}
      BRANCH: ${{ needs.publish.outputs.branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Trusted copy of the release tooling (from main)
        run: cp -r atlas-tools/release "$RUNNER_TEMP/release-tools"
      # A 1-hour token of the "PlotNua Release" GitHub App (Contents only, this repository only, no Workflows
      # permission), from the release-automation environment (main only). Used only to push release/auto/ branches,
      # so that the Image rights gate starts on a PUSH: the only gate main's required check counts (Stage 1, 10 Nov 2026).
      - name: Release push token (PlotNua Release App)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510   # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
      - name: Wait for the gate on this exact commit, promote, verify live
        env:
          RELEASE_PUSH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          [[ "$BRANCH" == release/auto/garden-* ]] || { echo "REFUSED: unexpected release branch"; exit 1; }
          git config user.name "PlotNua release automation"; git config user.email "hello@plotnua.ie"
          bash "$RUNNER_TEMP/release-tools/promote-after-gate.sh" "$SHA" "$BRANCH"
