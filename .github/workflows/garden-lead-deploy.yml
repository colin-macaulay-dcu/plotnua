# PlotNua · garden-lead Worker deployment ("plotnua-garden-lead"), Package N Step C (prepared 26 Nov 2026).
# NOT A DATABASE CHANGE, AND IT CANNOT OPEN ANYTHING.
#
# Deploys the Worker CLOSED: the commit's wrangler.toml must ship every switch "false" (both the Yard Box Phase A switches
# and the four INTRO_* switches) and the introduction supplier allow-list must be empty. Opening any switch is a separate,
# later founder step (release proposal steps D, F, G in governance/PACKAGE-N-INTRODUCTIONS.md), never this workflow.
#   1. "check": the commit is a full ID on main and its configuration is closed.
#   2. "deploy" waits in the environment "studio-production." until the founder presses Approve in GitHub; only then can it
#      read the existing Cloudflare token STUDIO_CF_DEPLOY_TOKEN (no new secret or token).
#   3. It READS the Worker's live settings (it may not exist yet: first deployment) and refuses if any switch is open.
#   4. It deploys with --keep-vars, so a value set at the console (AIRTABLE_BASE) is kept, and secrets are never touched.
#   5. It reads the settings again and checks the Worker from outside WITHOUT writing anything (no preview key is sent).
#      If that fails after replacing an existing version, it rolls back at once.
# Logs are public: switch names and values, secret NAMES and PASS/FAIL only.
name: PlotNua garden-lead deploy
run-name: "Garden-lead deploy ${{ inputs.commit }}${{ inputs.dry_run && ' (dry run)' || '' }}"

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Full 40-character commit ID approved by the founder (must be on main)"
        required: true
        type: string
      dry_run:
        description: "Dry run: approval, live-settings check and build only; nothing sent to Cloudflare"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: plotnua-garden-lead-cloudflare
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The commit is on main and deploys a closed Worker
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "REFUSED: give the full 40-character commit ID"; exit 1; }
          git merge-base --is-ancestor "$COMMIT" origin/main || { echo "REFUSED: $COMMIT is not on main"; exit 1; }
          git show "$COMMIT:worker/garden-lead/wrangler.toml" | python3 -c '
          import sys, tomllib
          d = tomllib.loads(sys.stdin.read()); v = d["vars"]
          S = ["LEAD_PUBLIC_ENABLED","WRITES_ENABLED","EMAIL_ENABLED","INTRO_PUBLIC_ENABLED","INTRO_WRITES_ENABLED","INTRO_NOTIFY_ENABLED","INTRO_RETENTION_ENABLED"]
          bad = [k for k in S if v.get(k) != "false"]
          if bad: sys.exit("REFUSED: these switches must ship \"false\": " + ", ".join(bad))
          if any(k in v for k in ("AIRTABLE_TOKEN","LEAD_PREVIEW_KEY","RESEND_API_KEY")): sys.exit("REFUSED: a secret name appears as a plain variable")
          print("switches closed:", ", ".join(S))'
          git show "$COMMIT:worker/garden-lead/src/introduction.js" | grep -q "^export const INTRO_SUPPLIERS = Object.freeze({});" \
            || { echo "REFUSED: the introduction supplier allow-list is not empty (adding a supplier is release step G)"; exit 1; }
          echo "GUARD OK · $COMMIT" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worker proofs at that commit
        run: |
          git checkout -q "${{ inputs.commit }}"
          cd worker/garden-lead && npm run -s prove

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: "studio-production."   # the configured environment's exact name, including the final full stop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check again after approval
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git fetch -q origin main
          git merge-base --is-ancestor "$COMMIT" origin/main || { echo "REFUSED: $COMMIT is not on main"; exit 1; }
          test "$(git rev-parse HEAD)" = "$COMMIT" || { echo "REFUSED: the checked-out tree is not $COMMIT"; exit 1; }
      - name: Live settings before (read-only) · every switch must be closed
        id: before
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STUDIO_CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          node atlas-tools/release/garden-lead/settings.mjs before | tee "$RUNNER_TEMP/before.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          if grep -q "not deployed yet" "$RUNNER_TEMP/before.txt"; then echo "existed=false" >> "$GITHUB_OUTPUT"; else echo "existed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Build only (dry run; nothing sent to Cloudflare)
        if: ${{ inputs.dry_run }}
        working-directory: worker/garden-lead
        run: |
          set -o pipefail
          npx --yes wrangler@4.150.0 deploy --dry-run --outdir "$RUNNER_TEMP/build" > "$RUNNER_TEMP/wrangler.log" 2>&1 \
            || { grep -iE "error" "$RUNNER_TEMP/wrangler.log" | head -5; exit 1; }
          echo "DRY RUN OK: the closed Worker builds; nothing was sent to Cloudflare"
      - name: Deploy the closed Worker (live console variables kept; secrets untouched)
        id: deploy
        if: ${{ !inputs.dry_run }}
        working-directory: worker/garden-lead
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STUDIO_CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@4.150.0 deploy --keep-vars > "$RUNNER_TEMP/wrangler.log" 2>&1 \
            || { echo "FAIL  the deployment did not complete"; grep -iE "^\s*(✘|X )?\[?error|permission|authentication" "$RUNNER_TEMP/wrangler.log" | grep -viE "token" | head -5; exit 1; }
          grep -E "^Uploaded |^Current Version ID|schedule" "$RUNNER_TEMP/wrangler.log" || true
      - name: After the deploy · settings closed, and the Worker checked from outside (nothing is written)
        id: live
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STUDIO_CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          sleep 10
          node atlas-tools/release/garden-lead/settings.mjs after | tee -a "$GITHUB_STEP_SUMMARY"
          bash atlas-tools/release/garden-lead/outside-check.sh https://plotnua-garden-lead.colin-a41.workers.dev | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Automatic rollback to the previous version
        if: ${{ failure() && steps.deploy.outcome == 'success' && steps.live.outcome == 'failure' && steps.before.outputs.existed == 'true' }}
        working-directory: worker/garden-lead
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STUDIO_CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.150.0 rollback --message "automatic rollback: failed checks after deploy (run ${{ github.run_id }})" -y > "$RUNNER_TEMP/rb.log" 2>&1 && echo "rolled back to the previous version" || { echo "FAIL  automatic rollback did not complete"; grep -iE "error" "$RUNNER_TEMP/rb.log" | grep -viE "token" | head -3; exit 1; }
          echo "- **rolled back automatically** after failed checks" >> "$GITHUB_STEP_SUMMARY"
