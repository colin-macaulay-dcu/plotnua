# PlotArt · three galleries (Phase B) · test on a REAL, TEMPORARY Cloudflare D1 database (final gallery identity, 24 Nov 2026:
# contemporary · environment · being). NEVER production, never the shared TEST database plotart-checkout-test, and it does NOT
# use the checkout-test environment (whose protection stays exactly as it is). It runs only in its OWN environment,
# "plotart-gallery-d1-test", which the founder sets up once (required reviewer: the founder; deployment branch: only
# dev/plotart-three-galleries-phase-b; secret GALLERY_D1_TEST_CF_TOKEN; variables CLOUDFLARE_ACCOUNT_ID and
# GALLERY_D1_TEST_READY = yes). The run creates its own empty database (plotart-gallery-phaseb-test-<run id>), addresses only
# that database by the id it was given (checked against the name it created), and deletes it at the end, whatever happens.
# Started ONLY by a change to worker/plotart-studio/test/galleries-cloudflare-test-request.json on
# dev/plotart-three-galleries-phase-b, and waits for the founder's Approve. What it does (test/cf-gallery-test.mjs --db-only):
#   1 loads the production schema (main) and a staging copy of the live galleries (public data, synthetic emails)
#   3 takes a Time Travel restore point; 4 applies migration 0023 with the production command and checks every existing
#     table is byte-identical, every existing definition unchanged, exactly seven new empty tables; foreign keys enforced
#   5 checks the gallery rules in the database: earlier identifiers refused; live needs approval and acceptance; a failed
#     multi-statement write leaves nothing behind; deleting an artwork or an artist removes its gallery rows (ON DELETE
#     CASCADE); nothing assigned to Environment or Being
#   6 rollback rehearsal: export the gallery rows, drop only the seven gallery tables (everything else unchanged), re-apply,
#     re-import (identical); then a Time Travel restore to the restore point (whole database identical to before 0023)
# DATABASE-ONLY (founder review, 24 Nov 2026): the run uses Cloudflare's D1 API alone (wrangler d1 create / execute / export /
# time-travel / delete). No Worker is started, uploaded or deployed, so the token needs D1: Edit and nothing else; a token
# without any Workers permission cannot change, deploy or delete any Worker. Steps 2 and 5 check the gallery rules directly in
# the database (see test/cf-gallery-test.mjs --db-only); the Studio-level behaviour is proven locally (prove-galleries*).
# Clean-up, FAIL-CLOSED (founder safeguards, 24 Nov 2026; logic and self-test in test/cf-test-cleanup.mjs):
#   - the run's own database is deleted in an always() step that runs whenever the create step started (also after a
#     failure, a timeout or a cancellation); success is reported ONLY when a fresh, readable `d1 list` shows the database
#     gone by name and by id. A failed delete, a failed or unreadable list, or a database still present is a visible failure.
#   - before creating anything, databases left by EARLIER runs of this test (names exactly
#     plotart-gallery-phaseb-test-<run id>-<attempt>, never anything else) are deleted only when GitHub shows their run has
#     finished (completed, or moved on to a later attempt). If the run is still queued, waiting or in progress, or its status
#     cannot be read, the database is left alone and reported for manual review. A failed list, a failed delete or an
#     unconfirmed deletion stops the run before anything is created.
# Logs are public: PASS/FAIL, counts and table names only. The database id is never printed.
name: PlotArt three galleries on a temporary Cloudflare D1
run-name: "Three galleries · temporary Cloudflare D1 · ${{ github.sha }}"
on:
  push:
    branches: [dev/plotart-three-galleries-phase-b]
    paths: [worker/plotart-studio/test/galleries-cloudflare-test-request.json]
permissions:
  contents: read
  actions: read          # read-only: to see whether the run that left a database behind has finished
concurrency:
  group: plotart-gallery-d1-test
  cancel-in-progress: false
jobs:
  d1-test:
    runs-on: ubuntu-latest
    environment: plotart-gallery-d1-test
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      READY: ${{ vars.GALLERY_D1_TEST_READY }}
      DB_NAME: plotart-gallery-phaseb-test-${{ github.run_id }}-${{ github.run_attempt }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guards
        run: |
          set -euo pipefail
          [ "${{ github.ref }}" = refs/heads/dev/plotart-three-galleries-phase-b ] || { echo "REFUSED: runs only from dev/plotart-three-galleries-phase-b"; exit 1; }
          [ "$READY" = yes ] || { echo "REFUSED: the plotart-gallery-d1-test environment is not set up (GALLERY_D1_TEST_READY is not yes). Nothing was done."; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || { echo "REFUSED: CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          [[ "$DB_NAME" =~ ^plotart-gallery-phaseb-test-[0-9]+-[0-9]+$ ]] || { echo "REFUSED: database name"; exit 1; }
          node worker/plotart-studio/test/cf-test-cleanup.mjs --self-test > "$RUNNER_TEMP/cleanup-selftest.log" || { cat "$RUNNER_TEMP/cleanup-selftest.log"; echo "REFUSED: the clean-up safeguards failed their self-test"; exit 1; }
          echo "  PASS  clean-up safeguards self-test"
          echo "  PASS  name of this run's database: $DB_NAME" 
          ! git show origin/main:worker/plotart-studio/schema.sql | grep -q gallery_memberships || { echo "REFUSED: main already has migration 0023"; exit 1; }
          echo "### Three galleries · temporary Cloudflare D1" >> "$GITHUB_STEP_SUMMARY"
      - name: Databases left by earlier runs (deleted only if their run has finished; otherwise reported)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.GALLERY_D1_TEST_CF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          C: worker/plotart-studio/test/cf-test-cleanup.mjs
        run: |
          set -uo pipefail
          W="npx --yes wrangler@4.150.0"
          $W d1 list --json > "$RUNNER_TEMP/list.json" 2> "$RUNNER_TEMP/list.log" \
            || { python3 atlas-tools/release/studio/wrangler-error.py "$RUNNER_TEMP/list.log"; echo "FAIL  the D1 database list could not be read: stopped before anything was created"; exit 1; }
          node "$C" plan-leftovers --list "$RUNNER_TEMP/list.json" --run-id "${{ github.run_id }}" --attempt "${{ github.run_attempt }}" > "$RUNNER_TEMP/plan.json" \
            || { echo "FAIL  the D1 database list was not readable: stopped before anything was created"; exit 1; }
          node -e 'const p=require(process.argv[1]);for(const r of p.review){console.log("::warning::Left for manual review: "+r.name+" ("+r.reason+")")}' "$RUNNER_TEMP/plan.json"
          node -e 'const p=require(process.argv[1]);for(const r of p.review)console.log("- **Left for manual review:** `"+r.name+"` ("+r.reason+")")' "$RUNNER_TEMP/plan.json" >> "$GITHUB_STEP_SUMMARY"
          FAIL=0
          for N in $(node -e 'for(const n of require(process.argv[1]).delete)console.log(n)' "$RUNNER_TEMP/plan.json"); do
            [[ "$N" =~ ^plotart-gallery-phaseb-test-[0-9]+-[0-9]+$ ]] || { echo "REFUSED: unexpected name"; FAIL=1; continue; }
            $W d1 delete "$N" -y > "$RUNNER_TEMP/del.log" 2>&1 || { python3 atlas-tools/release/studio/wrangler-error.py "$RUNNER_TEMP/del.log"; echo "FAIL  could not delete the leftover $N (its run has finished)"; FAIL=1; continue; }
            $W d1 list --json > "$RUNNER_TEMP/list2.json" 2>/dev/null; node "$C" verify-gone --list "$RUNNER_TEMP/list2.json" --name "$N"; V=$?
            if [ $V -eq 0 ]; then echo "  PASS  removed the leftover $N (its run had finished)"; echo "- Removed leftover \`$N\` (its run had finished)" >> "$GITHUB_STEP_SUMMARY";
            else echo "FAIL  could not confirm that the leftover $N is gone"; FAIL=1; fi
          done
          [ $FAIL -eq 0 ] || { echo "- **Stopped:** a leftover test database could not be removed or its removal could not be confirmed" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          echo "  PASS  leftovers handled (reported ones, if any, are left for manual review)"
      - name: Create the temporary database (empty, Western Europe)
        id: create
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.GALLERY_D1_TEST_CF_TOKEN }}
        run: |
          set -uo pipefail
          npx --yes wrangler@4.150.0 d1 create "$DB_NAME" --location weur > "$RUNNER_TEMP/create.log" 2>&1 \
            || { python3 atlas-tools/release/studio/wrangler-error.py "$RUNNER_TEMP/create.log"; echo "LIMITATION: the gallery test credentials cannot create a D1 database (see the reason above). Nothing was created."; echo "- **Stopped:** the gallery test credentials cannot create a D1 database" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$RUNNER_TEMP/create.log" | head -1)
          [ -n "$ID" ] || { echo "FAIL  no database id in the create output"; exit 1; }
          N=$(npx --yes wrangler@4.150.0 d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.uuid===process.argv[1]);console.log(d?d.name:"")})' "$ID")
          [ "$N" = "$DB_NAME" ] || { echo "REFUSED: the id returned is not the database this run created"; exit 1; }
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "  PASS  temporary database $DB_NAME created (empty)"
          echo "- Temporary database \`$DB_NAME\` created" >> "$GITHUB_STEP_SUMMARY"
      - name: Test migration 0023 on it (database-only)
        working-directory: worker/plotart-studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.GALLERY_D1_TEST_CF_TOKEN }}
          DBID: ${{ steps.create.outputs.id }}
        run: |
          set -o pipefail
          node test/cf-gallery-test.mjs --target remote --db-only --database-id "$DBID" --out "$RUNNER_TEMP/cftest" 2>&1 | grep -vE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | tee "$RUNNER_TEMP/cftest.log"
          { echo '```'; grep -E "PASS|FAIL|checks,|SHA-256" "$RUNNER_TEMP/cftest.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Delete the temporary database (always) and confirm it is gone (fail-closed)
        if: ${{ always() && steps.create.outcome != 'skipped' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.GALLERY_D1_TEST_CF_TOKEN }}
          DBID: ${{ steps.create.outputs.id }}
          C: worker/plotart-studio/test/cf-test-cleanup.mjs
        run: |
          set -u
          W="npx --yes wrangler@4.150.0"
          [[ "$DB_NAME" =~ ^plotart-gallery-phaseb-test-[0-9]+-[0-9]+$ ]] || { echo "REFUSED: database name"; exit 1; }
          # delete by this run's own name (also when the create step stopped before recording the id)
          if $W d1 delete "$DB_NAME" -y > "$RUNNER_TEMP/delete.log" 2>&1; then DEL=ok; else DEL=failed; python3 atlas-tools/release/studio/wrangler-error.py "$RUNNER_TEMP/delete.log"; fi
          # success only when a fresh, readable list shows it gone by name and by id (three tries for D1's list to catch up)
          V=2
          for i in 1 2 3; do
            if $W d1 list --json > "$RUNNER_TEMP/after.json" 2> "$RUNNER_TEMP/after.log"; then
              node "$C" verify-gone --list "$RUNNER_TEMP/after.json" --name "$DB_NAME" --id "${DBID:-}"; V=$?
            else V=2; fi
            [ $V -eq 1 ] && [ $i -lt 3 ] && { sleep 10; continue; }
            break
          done
          case $V in
            0) if [ "$DEL" = ok ]; then echo "  PASS  temporary database deleted and confirmed gone"; echo "- Temporary database deleted and confirmed gone" >> "$GITHUB_STEP_SUMMARY";
               else echo "  PASS  the temporary database is not present (it was never created, or was already gone)"; echo "- Temporary database confirmed absent (delete reported: $DEL)" >> "$GITHUB_STEP_SUMMARY"; fi ;;
            1) echo "FAIL  the temporary database $DB_NAME STILL EXISTS: delete it in the Cloudflare dashboard (D1)"; echo "- **FAIL: the temporary database \`$DB_NAME\` still exists. Delete it in the Cloudflare dashboard.**" >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
            *) python3 atlas-tools/release/studio/wrangler-error.py "$RUNNER_TEMP/after.log" 2>/dev/null; echo "FAIL  clean-up could NOT be verified (the database list could not be read): check D1 for $DB_NAME by hand"; echo "- **FAIL: clean-up could not be verified. Check the Cloudflare dashboard (D1) for \`$DB_NAME\`.**" >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
          esac
