# PlotArt public site on plotart.ie · automatic deploy (domain migration R1, prepared 26 Nov 2026).
#
# Keeps plotart.ie identical to plotnua.ie/plotart/ without anyone maintaining a second website:
# whenever main changes anything the PlotArt site is built from (a website release the founder approved, or an
# automatic Studio content publication, which moves main as the PlotNua Release App), this workflow rebuilds the
# site from plotart/ and deploys it to the plotart-site Worker. Routine content therefore needs no extra approval.
#
# Safeguards kept:
#   * It runs only from main, and only what main already contains: every change to main still passes the image
#     rights gate and, for software and infrastructure, the founder's website-production approval.
#   * The Worker code, its configuration (including the noindex switch and anything about routing) and this file are
#     part of the repository, so they change only through those approved releases. Custom domains are attached in the
#     Cloudflare dashboard at an approved checkpoint, never by this workflow.
#   * Inert until the founder enables it: repository variable PLOTART_SITE_ENABLED = true (Settings -> Secrets and
#     variables -> Actions -> Variables) and the environment "plotart-site" holding the secret PLOTART_SITE_CF_TOKEN
#     (a Cloudflare API token limited to Account / Workers Scripts / Edit) and the variable CLOUDFLARE_ACCOUNT_ID.
#     The environment allows the main branch only.
#   * After every deploy the live check runs against the Worker; if it fails, the previous version is restored
#     automatically (wrangler rollback) and the run fails, so the founder is notified by GitHub.
# Logs are public: no step prints a credential or an account identifier.
name: PlotArt site deploy (plotart.ie)
on:
  push:
    branches: [main]
    paths:
      - 'plotart/**'
      - 'assets/brand/**'
      - 'assets/identity/**'
      - 'assets/founder/**'
      - 'assets/img/**'
      - '404.html'
      - 'sitemap.xml'
      - 'worker/plotart-site/**'
      - 'atlas-tools/plotart_site_build.py'
      - 'atlas-tools/plotart_shell.py'
      - 'atlas-tools/plotart_seo.py'
      - 'atlas-tools/release/plotart-launch-switches.json'
      - 'atlas-tools/prove-plotart-domain.py'
      - '.github/workflows/plotart-site-deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: plotart-site-deploy
  cancel-in-progress: false    # deploys run in order; the last one always wins

jobs:
  deploy:
    if: vars.PLOTART_SITE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: plotart-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the site from plotart/
        working-directory: worker/plotart-site
        run: |
          INDEXING=$(sed -nE 's/^INDEXING *= *"([a-z]+)".*/\1/p' wrangler.toml)
          case "$INDEXING" in noindex) MODE=test;; index) MODE=live;; *) echo "FAIL  INDEXING must be noindex or index"; exit 1;; esac
          echo "INDEXING=$INDEXING" >> "$GITHUB_ENV"
          python3 ../../atlas-tools/plotart_site_build.py ../.. dist --mode "$MODE"
          node test/prove-site.mjs "$PWD/dist" "$GITHUB_WORKSPACE"
      - name: Deploy
        working-directory: worker/plotart-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PLOTART_SITE_CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.150.0 deploy --message "main ${GITHUB_SHA::12}" > "$RUNNER_TEMP/wrangler.log" 2>&1 \
            || { echo "FAIL  the deployment did not complete"; grep -iE "error|permission|authentication" "$RUNNER_TEMP/wrangler.log" | grep -viE "token|https?://" | head -5; exit 1; }
          grep -E "^Uploaded |^Current Version ID" "$RUNNER_TEMP/wrangler.log" || true
      - name: Live check (every PlotArt address on the Worker)
        id: live
        env:
          SITE_BASE: ${{ vars.PLOTART_SITE_CHECK_BASE }}   # https://plotart.ie once attached; the workers.dev address before
        run: |
          sleep 20
          python3 atlas-tools/prove-plotart-domain.py . site --base "${SITE_BASE:-https://plotart.ie}" --indexing "$INDEXING"
      - name: Automatic rollback (live check failed)
        if: failure() && steps.live.outcome == 'failure'
        working-directory: worker/plotart-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PLOTART_SITE_CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.150.0 rollback --message "automatic rollback: failed live check (run ${{ github.run_id }})" -y > "$RUNNER_TEMP/rb.log" 2>&1 \
            && echo "rolled back to the previous version" || { echo "FAIL  automatic rollback did not complete"; exit 1; }
