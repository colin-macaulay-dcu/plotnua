# PlotArt Studio · Worker deployment (founder approval to prepare, 31 Oct 2026). NOT a database change.
#
# How a deployment happens:
#   1. The founder approves a specific commit in writing, and it is fast-forwarded onto main.
#   2. Claude starts this workflow with that full commit ID ("Run workflow").
#   3. "check" refuses anything that is not a full commit ID already on main, would roll back the live Studio,
#      or carries a bundle that does not match its sources. It lists the Studio files that will change.
#   4. "deploy" waits in the environment "studio-production." (exact name, with a final full stop) until the founder presses Approve in GitHub.
#      Only then can it read the Cloudflare token STUDIO_CF_DEPLOY_TOKEN (Workers Scripts: Edit, nothing else).
#   5. It deploys exactly that commit and checks the gallery order and reserved position 01 before and after.
#      The live release is read from this workflow's own history of successful real runs (read-only):
#      no job in this workflow can change the repository.
# dry_run: true goes through the same approval and builds the Worker without contacting Cloudflare (for testing).
# Logs are public: no step prints a credential, an identifier from the environment, or any artist information.
name: PlotArt Studio deploy
run-name: "Studio deploy ${{ inputs.commit }}${{ inputs.dry_run && ' (dry run)' || '' }}"

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Full 40-character commit ID approved by the founder (must be on main)"
        required: true
        type: string
      dry_run:
        description: "Dry run: approval and build only, nothing sent to Cloudflare"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  actions: read            # to read this workflow's own run history (which commit is live); nothing is written

concurrency:
  group: plotart-studio-cloudflare
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Which Studio release is live (from this workflow's successful real runs)
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LIVE=$(gh run list -R "$GITHUB_REPOSITORY" --workflow studio-deploy.yml --status success --limit 100 --json displayTitle \
                 --jq '[.[].displayTitle | select(test("^Studio deploy [0-9a-f]{40}$"))][0] // "" | sub("^Studio deploy "; "")')
          echo "commit=$LIVE" >> "$GITHUB_OUTPUT"
          echo "live release: ${LIVE:-baseline (no deployment through this workflow yet)}"
      - name: The commit is approved, on main, and contains the live Studio
        env:
          STUDIO_LIVE_COMMIT: ${{ steps.live.outputs.commit }}
          COMMIT: ${{ inputs.commit }}
          MODE: ${{ inputs.dry_run && '--allow-unchanged' || '' }}
        run: bash atlas-tools/release/studio/guard.sh "$COMMIT" $MODE

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: "studio-production."   # the configured environment's exact name, including the final full stop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Which Studio release is live (from this workflow's successful real runs)
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LIVE=$(gh run list -R "$GITHUB_REPOSITORY" --workflow studio-deploy.yml --status success --limit 100 --json displayTitle \
                 --jq '[.[].displayTitle | select(test("^Studio deploy [0-9a-f]{40}$"))][0] // "" | sub("^Studio deploy "; "")')
          echo "commit=$LIVE" >> "$GITHUB_OUTPUT"
          echo "live release: ${LIVE:-baseline (no deployment through this workflow yet)}"
      - name: Check again after approval (main or the live release may have moved while waiting)
        env:
          STUDIO_LIVE_COMMIT: ${{ steps.live.outputs.commit }}
          COMMIT: ${{ inputs.commit }}
          MODE: ${{ inputs.dry_run && '--allow-unchanged' || '' }}
        run: |
          bash atlas-tools/release/studio/guard.sh "$COMMIT" $MODE
          test "$(git rev-parse HEAD)" = "$COMMIT" || { echo "REFUSED: the checked-out tree is not $COMMIT"; exit 1; }
      - name: Production configuration (identifiers from the environment, never printed)
        env:
          STUDIO_D1_DATABASE_ID: ${{ vars.STUDIO_D1_DATABASE_ID }}
          STUDIO_ACCESS_AUD: ${{ vars.STUDIO_ACCESS_AUD }}
          STUDIO_ACCESS_TEAM: ${{ vars.STUDIO_ACCESS_TEAM }}
        run: python3 atlas-tools/release/studio/render-config.py worker/plotart-studio
      - name: Gallery order before
        if: ${{ !inputs.dry_run }}
        env:
          STUDIO_URL: ${{ secrets.STUDIO_URL }}
          STUDIO_PIPELINE_TOKEN: ${{ secrets.STUDIO_PIPELINE_TOKEN }}
          STUDIO_ACCESS_CLIENT_ID: ${{ secrets.STUDIO_ACCESS_CLIENT_ID }}
          STUDIO_ACCESS_CLIENT_SECRET: ${{ secrets.STUDIO_ACCESS_CLIENT_SECRET }}
        run: node atlas-tools/release/studio/order-check.mjs save "$RUNNER_TEMP/order-before"
      - name: Build only (dry run; nothing sent to Cloudflare)
        if: ${{ inputs.dry_run }}
        working-directory: worker/plotart-studio
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          set -o pipefail
          npx --yes wrangler@4.150.0 deploy --config wrangler.production.toml --dry-run --outdir "$RUNNER_TEMP/build" > "$RUNNER_TEMP/wrangler.log" 2>&1 \
            || { grep -iE "error" "$RUNNER_TEMP/wrangler.log" | head -5; exit 1; }
          echo "DRY RUN OK: the Worker for $COMMIT builds; nothing was sent to Cloudflare"
      - name: Deploy the Worker
        if: ${{ !inputs.dry_run }}
        working-directory: worker/plotart-studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STUDIO_CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@4.150.0 deploy --config wrangler.production.toml > "$RUNNER_TEMP/wrangler.log" 2>&1 \
            || { echo "FAIL  the deployment did not complete"; grep -iE "^\s*(✘|X )?\[?error|permission|authentication" "$RUNNER_TEMP/wrangler.log" | grep -viE "token|https?://" | head -5; exit 1; }
          grep -E "^Uploaded |^Current Version ID" "$RUNNER_TEMP/wrangler.log"
      # Publish on approval (founder decision 2 Nov 2026): the Studio holds a fine-grained GitHub token, limited to this
      # repository and "Actions: read and write", to start the Idea Board publishing workflow when the founder approves,
      # edits or removes an idea. Kept in this environment's secrets; passed to Cloudflare on stdin; never printed.
      - name: Studio publishing token (only when the environment holds one)
        if: ${{ !inputs.dry_run }}
        working-directory: worker/plotart-studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STUDIO_CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DISPATCH: ${{ secrets.STUDIO_GITHUB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH" ]; then echo "no publishing token in the environment: the Studio keeps using the scheduled run"; exit 0; fi
          printf '%s' "$DISPATCH" | npx --yes wrangler@4.150.0 secret put GITHUB_DISPATCH_TOKEN --config wrangler.production.toml > "$RUNNER_TEMP/secret.log" 2>&1 \
            && echo "publishing token installed in the Studio" || { echo "FAIL  the publishing token could not be installed"; grep -iE "error" "$RUNNER_TEMP/secret.log" | grep -viE "token" | head -3; exit 1; }
      - name: Gallery order after
        if: ${{ !inputs.dry_run }}
        env:
          STUDIO_URL: ${{ secrets.STUDIO_URL }}
          STUDIO_PIPELINE_TOKEN: ${{ secrets.STUDIO_PIPELINE_TOKEN }}
          STUDIO_ACCESS_CLIENT_ID: ${{ secrets.STUDIO_ACCESS_CLIENT_ID }}
          STUDIO_ACCESS_CLIENT_SECRET: ${{ secrets.STUDIO_ACCESS_CLIENT_SECRET }}
        run: node atlas-tools/release/studio/order-check.mjs compare "$RUNNER_TEMP/order-before"
