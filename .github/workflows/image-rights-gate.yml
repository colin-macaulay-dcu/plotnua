name: Image rights gate

# THE MECHANISM BEHIND A PROMISE.
#
# PlotNua's image-permission wording tells every supplier that a word to
# hello@plotnua.ie stops us using their images. A promise with nothing enforcing
# it is not a promise. This workflow is what enforces it.
#
# It walks the pages that are ACTUALLY PUBLISHED, finds every externally-hosted
# image they reference, and refuses the build if any of them lacks a live grant
# in image-rights-manifest.json. It does not read an assets spreadsheet and hope
# the spreadsheet is complete: anything a page can show a homeowner is an asset,
# whether or not someone remembered to record it.
#
# IT FAILS SAFE. Unknown, declined, withdrawn, a missing permission record, an
# unrecognised outcome, an image from a domain the grant does not cover, and a
# conditional grant whose required credit is absent are ALL refused. Anything
# the gate cannot positively establish is refused.
#
# IT RUNS ON EVERY PUBLISH. Not on a path filter over the manifest: a page that
# gains a supplier image must be caught even when the manifest is untouched,
# which is exactly the case a path filter would miss.
#
# NO SECRET, NO NETWORK. The manifest is a committed, generated artefact and the
# gate reads the tree. A CI job holding an Airtable token to decide whether an
# image may be published is a larger blast radius than this needs.
#
# NOTE ON STALENESS. The gate refuses a manifest older than 30 days, so a
# withdrawal that was never reflected here cannot quietly keep authorising an
# image. Regenerate and commit the manifest in the same act as recording a grant
# or a withdrawal.

# RELEASES (founder decision 23 Oct 2026). Pushing a release/* branch runs the gate
# on exactly that commit, by itself: the guarded release scripts no longer start it,
# they read its result for the exact commit (atlas-tools/release/gate-result.py) and
# never treat a green run on any other commit as approval. Production still changes
# only when the founder runs --release and types the confirmation.
on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-rights-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Prove PlotArt public search settings and bounded sitemap updates
        run: |
          python3 atlas-tools/prove-plotart-search.py
          python3 atlas-tools/prove-plotart-buyers.py
          python3 atlas-tools/prove-plotart-wall-size.py
          node atlas-tools/prove-plotart-wall-size.cjs

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
        # No dependencies. The gate is standard library only.

      - name: The manifest must exist and be readable
        run: |
          set -euo pipefail
          test -s image-rights-manifest.json \
            || { echo "::error::image-rights-manifest.json is missing. The gate refuses to publish supplier imagery without a rights manifest."; exit 2; }
          node -e "JSON.parse(require('fs').readFileSync('image-rights-manifest.json','utf8'))" \
            || { echo "::error::the rights manifest is not valid JSON"; exit 2; }

      # THE MANIFEST MUST STILL BE THE GENERATOR'S OUTPUT. It is generated from
      # image-rights-records.json, and a hand-edit there would be invisible
      # until it mattered. This regenerates in memory and compares: a manifest
      # that no longer matches its records has been edited by hand, and a
      # hand-edited rights manifest is exactly what nobody should trust.
      #
      # The comparison exempts ONE field: the manifest's own generated date.
      # It used to include it, which meant the check compared against today's
      # date and could only pass on the day the manifest was last committed --
      # so it failed every later publish with "regenerate" while the rights
      # were correct. A gate that cries wolf daily teaches the team to
      # regenerate reflexively to clear a red tick, which is the one habit that
      # would wave a real rights change through. Freshness was never enforced
      # here anyway: it is the --max-age-days rule below, which reads that same
      # date. The step after this one proves the exemption is narrow.
      - name: The manifest must match the canonical rights records
        run: |
          set -euo pipefail
          python3 .github/scripts/generate_image_rights_manifest.py --check \
            || { echo "::error::image-rights-manifest.json does not match image-rights-records.json. Regenerate it; do not hand-edit the manifest."; exit 2; }

      # AND THE EXEMPTION MUST STAY NARROW. A check that ignores a field is one
      # edit away from ignoring everything, and a relaxed check that has never
      # been seen to refuse is a comment. Eleven sabotages in temporary trees:
      # a downgraded grant, a widened domain, a hand-edited row, a softened
      # reality note, a reformatted file, a missing / malformed / FUTURE-dated
      # stamp, unreadable JSON and no manifest at all must each refuse -- and a
      # difference of date alone must pass. The real records, manifest and
      # generator are hashed before and after: a proof that edits what it
      # proves has proved nothing.
      - name: Prove the manifest date-stamp exemption is narrow
        run: python3 .github/scripts/prove-manifest-check-capability.py

      # THE GATE ITSELF. Exit 1 = a rights violation. Exit 2 = the gate could not
      # establish the facts, which is also a failure: a gate that passes when it
      # is confused is not a gate.
      - name: Refuse to publish any supplier image without a live grant
        run: |
          set -euo pipefail
          node atlas-tools/validate-image-rights.js \
            --scan-html . \
            --permissions image-rights-manifest.json \
            --max-age-days 30 \
            | tee "${RUNNER_TEMP}/gate.txt"

      # The gate's own behaviour is proved on every run, not assumed. Six build
      # scenarios in temporary trees: unknown, missing permission, wrong domain,
      # granted-and-authorised, the same imagery after withdrawal, and a
      # conditional grant with its required credit missing.
      # FAIL-OPEN CLOSED FOR THE SECOND TIME, 11 October 2026.
      #
      # The first version pointed at a path in another repository and ended in
      # `|| echo "::notice::..."`, so it printed a notice and passed on every
      # run. It was "fixed" by pointing it at
      # atlas-tools/prove-image-rights-gate-capability.mjs -- a file that did
      # not exist -- and KEEPING the `|| echo`. So it still passed on every
      # run. Same defect, same step, introduced twice.
      #
      # `test -f X && node X || echo` cannot fail. When X is absent the test
      # fails, the `&&` is skipped, the `||` runs, echo returns 0 and the step
      # is green. It is a required check that could never refuse anything.
      #
      # The proof now exists and this invokes it directly. No `test -f`, no
      # `||`, no fallback: if the file is missing, node exits non-zero and the
      # build fails, which is the correct behaviour for a required test.
      #
      # WHAT IT PROVES, and why it is not a duplicate of the self-test below.
      # `--self-test` drives the gate over a SYNTHETIC asset list. Production
      # runs `--scan-html .`, which walks the published pages. That is the path
      # that catches a page which GAINS a supplier image while the manifest is
      # untouched -- the case this workflow runs on every publish to catch --
      # and until now nothing proved it could refuse at all.
      - name: Prove the image-rights gate still catches what it is for
        run: node atlas-tools/prove-image-rights-gate-capability.mjs

      # THE PROVENANCE GUARD. A SEPARATE CONCERN, DELIBERATELY SEPARATE CODE.
      #
      # validate-image-rights.js skips every locally hosted image:
      #     if (!/^https?:\/\//i.test(u)) continue;  // relative = PlotNua's own
      # That was sound when everything local was PlotNua's own artwork. It
      # means the rights gate examines 40 external supplier images and skips
      # 101 local ones, so a laundered supplier photograph saved into assets/
      # would pass it silently.
      #
      # This guard declares the local images instead. It never answers a rights
      # question -- P11 asserts at source that the rights gate does not read
      # the provenance register and that no provenance record can grant a
      # permission. Exit 2 (cannot establish the facts) fails the build, same
      # as exit 1.
      - name: Every locally hosted image must be declared or enumerated
        run: node atlas-tools/validate-image-provenance.js

      - name: Prove the provenance guard can actually refuse
        run: node atlas-tools/prove-image-provenance-capability.mjs

      # THE LICENSED-PHOTOGRAPHY EXCEPTION (H2, 20 Oct 2026, founder decision).
      # P6 and P10 admit a supplier's name beside a composite ONLY as the
      # required credit of a live, modification-permitting grant that
      # enumerates the source photographs by SHA-256 and binds them to that
      # one composite; since H3 also its own visible caption and accessible
      # disclosure (P8) and the lock chain (P13). Forty-six ways of breaking
      # that must each refuse.
      - name: Prove the licensed-photography exception stays narrow
        run: node atlas-tools/prove-licensed-composite-exception.mjs

      # TIMBERIN CONTAINMENT. TimberIN granted two photographs, adapted into one
      # composite, recorded in image-adaptation-licences.json and deliberately
      # NOT in the rights records (where it would be a hot-link host grant and
      # would change TimberIN's Results listing basis). This keeps it that way
      # and refuses any hot-linked or re-hosted TimberIN image, with its own
      # capability proof.
      - name: TimberIN imagery stays two photographs inside one composite
        run: node atlas-tools/prove-timberin-containment.mjs

      # THE SUPPLIER PUBLICATION GATE. Separate concern, separate name: this
      # one decides whether a supplier may appear in public Results at all,
      # and holds BIOBUILDS while its corrected listing is under review.
      # No `||` fallback. If it cannot run, the build fails.
      - name: Prove the supplier publication gate
        run: |
          set -euo pipefail
          node atlas-tools/prove-supplier-publication-gate.mjs
          node atlas-tools/prove-supplier-publication-gate-capability.mjs

      # The gate's OWN self-test, including the scoped-delivery-host rule that
      # lets a supplier's images through a shared CDN on their store prefix and
      # refuses everyone else's. Cheap, and it proves the rule here rather than
      # leaving it to be discovered by a supplier it wrongly authorised.
      - name: The gate's self-test
        run: node atlas-tools/validate-image-rights.js --self-test

      # And the proof that the Power Sheds grant is what makes that image
      # publishable: eight ways of invalidating it, each of which must refuse.
      - name: Prove a live grant is load-bearing, not decorative
        run: node atlas-tools/prove-powersheds-grant.mjs

      # BIOBUILDS CONTAINMENT. The manifest scopes a grant by host and prefix
      # and has no notion of a page, so the biobuilds.com row would otherwise
      # pass their imagery on ANY page. BIOBUILDS asked to see the listing
      # before it goes live, so the grant covers the private noindexed preview
      # and nothing else. This is what keeps the row narrower than the gate
      # would enforce, and its own capability proof runs beside it.
      - name: The BIOBUILDS grant must stay inside the private review preview
        run: |
          set -euo pipefail
          node atlas-tools/prove-biobuilds-containment.mjs
          node atlas-tools/prove-biobuilds-containment-capability.mjs

      # PREVIEW-ONLY SUPPLIERS. These ones granted NOTHING -- they replied
      # asking to SEE the preview when the outreach offered both YES and
      # PREVIEW. There is no manifest row to scope because there is no grant,
      # so what has to be proved is ABSENCE: their published facts on the page,
      # none of their imagery anywhere, and nothing in the public journey.
      # One proof over a register, so adding a supplier cannot forget a check.
      - name: Preview-only suppliers must stay contained
        run: |
          set -euo pipefail
          node atlas-tools/prove-preview-only-containment.mjs

      # SUPPLIER PREVIEW IMAGE TREATMENTS -- standard v1.1, approved 18 Oct
      # 2026. A preview may present its image position as authorised
      # photography (T1), an original generic illustration (T2) or an
      # image-free typographic panel (T3). T1 is already held to its grant by
      # the gate above. This holds every T2 drawing to the shared rules --
      # pure inline vector, visibly labelled generic and not the supplier's
      # product, never named as the product, no rights narration -- and proves
      # each rule refuses its break. The EcoSauna builder's own capability
      # proof runs beside it.
      - name: Supplier preview illustrations must be generic, labelled and vector-only
        run: |
          set -euo pipefail
          python3 atlas-tools/prove-preview-image-treatments.py
          python3 supplier-preview-system/prove-ecosauna-guards.py

      # DISCOVERY LIBRARY IMAGES. Founder rule of 3 October 2026: each card
      # shows the discovery REALISED, chosen editorially and recorded in
      # atlas-tools/discovery-library-images.json. The guard's main job is to
      # refuse a potential-asset plate -- the empty wall, the bare lawn, the
      # before state -- which is what two earlier selector-based rules kept
      # selecting. Its capability proof drives that case with the real
      # before-plates from the real pages.
      - name: Discovery Library cards must show the realised image
        run: |
          set -euo pipefail
          node atlas-tools/prove-discovery-library-images.mjs
          python3 atlas-tools/prove-discovery-library-capability.py

      # ATLAS A, PHASE 1. The mark is a claim — "Atlas established this" — so
      # the guard is not that the icon renders but that it never renders over
      # something Atlas did not establish for the exact model on screen.
      # pnEvidenceState() === 'established' is NOT sufficient: 1,350 of 1,898
      # established reads are supplier- or range-level. The proof lifts the
      # shipped functions and drives them over the real universe.
      #
      # It also holds the SUPPLIED ARTWORK to account. The founder-supplied
      # pack is used as provided, so the proof asserts that the copy inlined
      # into your-plot.html is byte-identical to
      # assets/brand/atlas-mark-motion-ready.svg, that there is exactly one
      # copy of it in the page, and that #atlas-house carries no animation
      # rule. The mark cannot be quietly redrawn or set moving without this
      # step failing.
      - name: The Atlas A mark must never claim unestablished verification
        run: node atlas-tools/prove-atlas-a.mjs

      # AND IT MUST ACTUALLY RENDER. The step above reads the page as TEXT, and
      # it passed on four commits while not one hydrated Atlas mark appeared in
      # a browser: the bootstrap resolved its template before the parser had
      # reached it, returned on its second line, and never installed
      # pnAtlasHydrate at all. Every source-level assertion was true and the
      # feature was dead. So this step EXECUTES the shipped bootstrap against a
      # minimal DOM in real source order, and reconstructs the OLD bootstrap as
      # a control that must fail the same harness -- a harness that cannot
      # reproduce the bug would prove nothing about the fix.
      - name: Prove Atlas hydration survives template parse order
        run: node atlas-tools/prove-atlas-hydration-order.mjs

      # AND THAT PROOF'S OWN CAPABILITY. It gained a second imagery mode for
      # OGNYX, who invited imagery for their preview while withholding
      # publication, and new containment code that has never been seen to
      # refuse is a comment. Since OGNYX graduated (14 Oct 2026) no real
      # supplier uses that mode, so the sabotages run against a synthetic
      # fixture installed and removed per case; every touched file is hashed
      # before and after.
      - name: The containment proof must still catch what it is for
        run: python3 atlas-tools/prove-preview-only-capability.py

      # OGNYX, BY ENUMERATION. A publication grant for FOUR named images,
      # while the manifest row would pass any ognyx.com image anywhere. This
      # is the difference: only the four, credited and linked wherever they
      # appear, visualisations labelled, and no unsupported claim in any
      # published OGNYX record.
      - name: OGNYX imagery stays the four enumerated assets
        run: |
          set -euo pipefail
          node atlas-tools/prove-ognyx-imagery-containment.mjs
          python3 atlas-tools/prove-ognyx-imagery-capability.py
          # The Garden Retreat maker-image section (build/prove-garden-retreat-
          # maker-imagery) was retired by the 14 Oct 2026 restructure brief:
          # OGNYX is not presented as a standalone catalogue in the editorial.
          # The four images stay authorised (ognyx-preview.html) and contained.
          python3 atlas-tools/build-garden-retreat-restructure.py --check
          python3 atlas-tools/prove-garden-retreat-restructure.py
          # Product navigation in the maker explorer (14 Oct 2026): product
          # links only under a link-back grant, images only by enumeration.
          python3 atlas-tools/build-maker-explorer.py --check
          # DISC-008 pricing correction (4 Nov 2026): every garden-room price in the Maker Explorer
          # equals the product page's own pnPriceView, run from your-plot.html itself.
          node atlas-tools/prove-explorer-price-parity.mjs
          python3 atlas-tools/prove-maker-explorer-navigation.py
          # Premium Supplier Gallery (founder design approval 30 Oct 2026): the
          # Garden Retreat region must be current with the Maker Explorer config
          # (a maker update must rebuild it), and every image in it must be an
          # approved asset or its recorded delivery variant, credited and labelled.
          python3 atlas-tools/build-supplier-gallery.py --check
          python3 atlas-tools/prove-supplier-gallery.py
          # Wellness publication states (Tanktribe, Irish Sauna Company) are
          # recorded only from their own replies, and the universe is gated.
          python3 atlas-tools/build-wellness-publication-records.py --check
          python3 .github/scripts/test_wellness_universe.py
          node atlas-tools/prove-cluster2-garden-retreat.mjs

      # POSSIBILITY REVEAL (Phase 4, 19 Oct 2026). The homepage hero component
      # is generated from the approved L2B prototype and its nine images from
      # the locked L1+L2A master. These refuse a hand-edited or unscoped
      # component, a second H1, enabled commerce, or an image that differs from
      # its recorded encoding. Provenance itself stays with the guard above.
      - name: The H6 garden component and its images match their records
        run: |
          set -euo pipefail
          # H6 (26 Oct 2026) replaces the Possibility Reveal component on the homepage.
          # The guard checks: the generated snippet is mounted verbatim in the hero slot,
          # every file and image matches h6-record.json, one H1, scoped ids and CSS, lazy
          # layers, the AI label, no supplier name, and the Atlas figures, analytics and
          # consent blocks unchanged from the recorded homepage baseline.
          python3 atlas-tools/build-h6-homepage.py --check

      - name: The shared identity layer stays reversible, scoped and equal to the homepage
        run: |
          set -euo pipefail
          python3 atlas-tools/build-identity-stage1.py --check
          python3 atlas-tools/prove-identity-stage1.py

      # Global header v2 (founder approval 23 Oct 2026). One renderer
      # (atlas-tools/pn_header.py), one stylesheet (assets/identity/pn-header.css),
      # placed by the identity builder and the global builder. Every approved page
      # must carry exactly the rendered header; Your Plot and the property checks
      # must not; the WhatsApp link, the homepage (i) and the rail order are fixed.
      - name: Every approved page carries the one global header, exactly as rendered
        run: |
          set -euo pipefail
          python3 atlas-tools/build-global-header.py --check
          python3 atlas-tools/prove-global-header.py
          python3 atlas-tools/prove-global-header-capability.py

      # Premium Discovery (Stage 2c, founder approval of the direction 23 Oct 2026).
      # A Home for Art keeps its head, photographs, links, anchors, check entries,
      # TAKE-PART marker and cautions; every wording change is declared; the
      # Artists' Exemption is never stated without Revenue's determination
      # requirement. The BASE is a pinned snapshot, so the shallow checkout suffices.
      - name: Premium Discovery pages keep their governed content, imagery, links and cautions
        run: |
          set -euo pipefail
          python3 atlas-tools/prove-premium-discovery-a-home-for-art.py
          python3 atlas-tools/prove-premium-discovery-capability.py
          # The Hidden Bins editorial redesign (founder approval, 3 Nov 2026): wording, links, images,
          # head, JSON-LD, slider and property check unchanged against the pinned 202d292 snapshot.
          python3 atlas-tools/prove-premium-discovery-hidden-bins.py
          # The Hidden Cars editorial redesign (founder approval, 3 Nov 2026): every text block, link, image,
          # id and comment preserved against the pinned 45eac1e snapshot; narrative order rules hold.
          python3 atlas-tools/prove-premium-discovery-hidden-cars.py
          # The Driveway Income editorial redesign (founder approval, 3 Nov 2026): every text block, link, image,
          # id and comment preserved against the pinned ce0f130 snapshot; the caveat precedes the reported figures.
          python3 atlas-tools/prove-premium-discovery-driveway-income.py
          # The Neighbourhood Parcel House editorial redesign (founder approval of design, 3 Nov 2026): every
          # text block, link, image, id and comment preserved against the pinned snapshot, except the declared
          # founder refinements (opening line, favour / paid-network distinction, one reworded boundary sentence).
          python3 atlas-tools/prove-premium-discovery-parcel-house.py
          # DISC-026 The House as a Power Station editorial redesign (founder approval, 3 Nov 2026): every text
          # block, link, image, id and comment preserved against the pinned e0af0cd snapshot except the declared
          # corrections (Phase 0 B3-B9) and additions; Look again, Provider Explorer fence and GridNua banner pinned
          # byte for byte. The fault test proves the guard catches every listed regression.
          python3 atlas-tools/prove-premium-discovery-power-station.py
          python3 atlas-tools/prove-premium-discovery-power-station.py --faults
          # DISC-008 Living in the Garden six-chapter redesign (founder approval, 3 Nov 2026): every text block,
          # link, image and id preserved against the pinned production snapshot (fd5b1b5) except the declared removals (the
          # duplicate Journey panels) and additions; hero slider pinned; one decision with both routes, free, no
          # intake or matching promise; no placeholders. The two-option guard keeps its reach on a fixture.
          python3 atlas-tools/prove-premium-discovery-living-garden.py
          python3 atlas-tools/prove-premium-discovery-living-garden.py --faults
          python3 atlas-tools/prove-discovery-two-option.py
          # DISC-031 The Natural Swimming Garden six-chapter redesign (founder approval, 4 Nov 2026): every text
          # block, link, image and id preserved against the pinned 544ecc3 snapshot except the declared navigation
          # relabel and additions; hero slider pinned; one decision with both routes (route B the existing WhatsApp
          # channel), free, no intake or matching promise; illustrative drawing labelled not to scale.
          python3 atlas-tools/prove-premium-discovery-natural-swimming.py
          python3 atlas-tools/prove-premium-discovery-natural-swimming.py --faults
          # DISC-001 Garden Retreat six-chapter redesign (founder approval for development, 4 Nov 2026): every text
          # block, link, image and id preserved against the pinned f32837f snapshot except the declared removal (the
          # "property check is being prepared" panel copy) and additions; header, hero slider, supplier gallery and Maker
          # Explorer byte-identical; one decision with both routes (route B the existing WhatsApp channel), free, no
          # intake, matching or assessment promise; indicative footprint drawing with desktop and phone layouts.
          python3 atlas-tools/prove-premium-discovery-garden-retreat.py
          python3 atlas-tools/prove-premium-discovery-garden-retreat.py --faults
          # DISC-016 Above and Beyond six-chapter redesign (founder approval, 4 Nov 2026): every text block, link,
          # image and id preserved against the pinned ebc14dd snapshot (sections moved, "Further afield" folded into
          # a closed <details>) plus declared additions; header and hero slider pinned; one decision with both
          # routes (route B the existing WhatsApp channel), free, no intake or matching promise; no exemption asserted.
          python3 atlas-tools/prove-premium-discovery-above-and-beyond.py
          python3 atlas-tools/prove-premium-discovery-above-and-beyond.py --faults
          # DISC-021 Your Home On Screen six-chapter redesign (founder approval, 4 Nov 2026): every text block, link,
          # image and id preserved against the pinned b66f086 snapshot except the declared removal (the closing
          # panel's "property check is being prepared" placeholder) and additions; header and hero slider pinned;
          # one decision with both routes (route B the existing WhatsApp channel), free; no booking or income promise.
          python3 atlas-tools/prove-premium-discovery-your-home-on-screen.py
          python3 atlas-tools/prove-premium-discovery-your-home-on-screen.py --faults
          # DISC-005 Home Exchange six-chapter redesign (founder approval, 4 Nov 2026): every text block, link, image,
          # id and collapsible answer preserved against the pinned f4b648e snapshot; HOME / AWAY hero slider and header
          # pinned; the Property Check moved whole into chapter 05; one decision with both routes (route B the existing
          # WhatsApp channel), free; no exchange, cover or saving promised.
          python3 atlas-tools/prove-premium-discovery-home-exchange.py
          python3 atlas-tools/prove-premium-discovery-home-exchange.py --faults
          # DISC-025 The Borrowed Garden six-chapter redesign (founder approval, 4 Nov 2026: editorial makeover only):
          # every text block, link, image, id and collapsible answer preserved against the pinned 4c97901 snapshot;
          # hero and header pinned; Provider Explorer byte-identical; the registers are not extended (no form, input,
          # fetch or register endpoint, exactly the two existing check links); route B the existing WhatsApp channel.
          python3 atlas-tools/prove-premium-discovery-borrowed-garden.py
          python3 atlas-tools/prove-premium-discovery-borrowed-garden.py --faults
          python3 atlas-tools/prove-discovery-two-option.py --self-test
          # DISC-020 Stay in the House You Love (founder Phase 2 build authorisation, 4 Nov 2026): SEO, one H1, the
          # pn-compare hero opening on BEFORE, AI disclosure, verified grant and planning statements with their limits,
          # the one labelled advertised figure, no supplier gallery or partner claim, free route B, declared images.
          python3 atlas-tools/prove-disc020-page.py
          # DISC-034 The Water Wall (founder build authorisation, private preview only, 4 Nov 2026): SEO, one H1, the
          # pn-compare hero opening on BEFORE, the register-approved AI label, dated and labelled advertised prices only,
          # no partner / sale / order / savings claims, not-to-scale diagram, free unprefilled WhatsApp route (ref WW).
          python3 atlas-tools/prove-disc034-page.py
          # DISC-035 The Outdoor Room (founder build authorisation, private preview only, 4 Nov 2026): SEO, one H1, the
          # pn-compare hero opening on BEFORE, the standard AI label, planning limits without exemption guarantees, the
          # pergola-only saving and no commission figure, no partner claims for researched installers, free route B (ref OR).
          python3 atlas-tools/prove-disc035-page.py
          # DISC-036 Extend the House (PLOTNUA-BUILD-001 Stage 1, private preview only, 5 Nov 2026): SEO, one H1, the pn-compare
          # hero on the PlotNua drawings opening on BEFORE, planning and building-control claims without exemption guarantees, no
          # cost figures, no data collection or endpoint, the frozen journey-save block, anonymous analytics only, no commercial claims.
          python3 atlas-tools/prove-disc036-page.py --self-test
          # DISC-037 The Resourceful Garden (released 8 Nov 2026): SEO, one H1, index/follow with exactly one sitemap entry,
          # search record and Garden Library card; the standard Before/Possible slider hero (Stage 10, opens at 100% BEFORE,
          # no crossfade left behind); the five declared chapter images with the AI label; provenance by hash; Groundfridge as an example
          # only (no partner, distributor or endorsement wording); planning limits without exemption guarantees.
          python3 atlas-tools/prove-disc037-page.py --self-test
          # DISC-038 The Hidden Shelter (Stage 3/4 private preview only, noindex, unlinked, 8-10 Nov 2026): noindex/nofollow, one
          # H1, the standard slider on the founder's C2PA pair opening at 100% BEFORE, the AI label, the chapter section drawing,
          # no distributor/installer/partner claims, planning and price qualifications, an inert form and no enquiry routing.
          python3 atlas-tools/prove-disc038-page.py --self-test
          # Safety lock (23 Oct 2026): the 17 Oct merge builder must refuse to
          # regenerate the approved Premium page, and must leave every file as it was.
          set +e; out=$(python3 atlas-tools/build-a-home-for-art-merge.py --apply 2>&1); rc=$?; set -e
          echo "$out"
          test "$rc" -eq 2 && grep -q "REFUSED: L1" <<<"$out"
          test -z "$(git status --porcelain)" || { git status --porcelain; echo "merge builder changed files"; exit 1; }

      # The release scripts' reader of this gate: only a green run on the exact
      # commit and release branch may approve a release (18 recorded cases, no network).
      - name: The release reader approves only the exact commit's own green run
        run: |
          set -euo pipefail
          python3 atlas-tools/release/prove-gate-result.py
          grep -q "branches: \[main, 'release/\*\*'\]" .github/workflows/image-rights-gate.yml

      # Premium pages (Batch 1, founder approval 23 Oct 2026). One registry
      # (atlas-tools/premium_pages.py); every legacy layout builder that could rewrite
      # a garden-room family page refuses before writing on a Premium page; each
      # Premium page keeps its governed wording, links, anchors and figures.
      - name: Premium pages keep their governed content, and no legacy builder can overwrite one
        run: |
          set -euo pipefail
          python3 atlas-tools/prove-premium-locks.py
          python3 atlas-tools/prove-premium-garden-room-prices.py
          python3 atlas-tools/prove-premium-garden-room-prices-capability.py

      # Idea Board (founder approval of the Phase 1 build, 1 Nov 2026): the board page and the Library card show exactly
      # the approved-ideas snapshot the content pipeline wrote, nothing hand-added, no personal data, noindex.
      - name: The Idea Board shows only founder-approved ideas
        run: |
          set -euo pipefail
          python3 atlas-tools/build-idea-board.py --check
          python3 atlas-tools/prove-idea-board.py
          python3 atlas-tools/prove-privacy-v9.py

      - name: The Borrowed Garden noticeboard shows only founder-approved listings
        run: |
          set -euo pipefail
          # The page is built from the approved-listings snapshot (public fields only, re-checked: no e-mail, phone,
          # link, Eircode or house number; closed lists; newest first; no monetisation field), and the privacy notice
          # (V10) and Terms say what the noticeboard does and does not do. Release candidate, 4 Nov 2026.
          python3 atlas-tools/build-garden-board.py --check
          python3 atlas-tools/prove-privacy-v10.py

      - name: Summary
        if: always()
        run: |
          {
            echo "### Image rights gate"
            echo ""
            echo '```'
            cat "${RUNNER_TEMP}/gate.txt" 2>/dev/null || echo "the gate did not produce output"
            echo '```'
            echo ""
            echo "UNKNOWN is not GRANTED. DECLINED is not GRANTED. WITHDRAWN is not GRANTED."
          } >> "$GITHUB_STEP_SUMMARY"
