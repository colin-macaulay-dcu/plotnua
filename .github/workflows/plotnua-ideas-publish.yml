name: Idea Board publishing

# THE CONTENT-ONLY ROUTE FROM PLOTART STUDIO TO THE PLOTNUA IDEA BOARD (Phase 1, 1 Nov 2026).
#
# ACTIVE from the public launch (founder authorisation 1 Nov 2026, Option B): it runs when "ideas_publish_enabled" is true
# in atlas-tools/release/flags.json on main (or the repository variable IDEAS_PUBLISH_ENABLED is "true"). Turning it off
# is one reviewed commit setting the flag to false. Only ideas the founder approved in PlotArt Studio are ever published.
#
# What it does (atlas-tools/plotnua-ideas-publish.py): takes the ideas the founder has approved in PlotArt Studio
# (public fields only), writes atlas-tools/idea-board/approved-ideas.json, rebuilds ideas.html and the Discovery
# Library's Idea Board card, and refuses unless only those changed (the Library byte-identical outside the marked card
# block) and the Idea Board proof passes. Only then does it push an audit branch and fast-forward main (never forced).
#
# Secrets: the same four the PlotArt content pipeline uses (STUDIO_URL, STUDIO_PIPELINE_TOKEN,
# STUDIO_ACCESS_CLIENT_ID, STUDIO_ACCESS_CLIENT_SECRET). No new secret is needed.
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write      # automation v1: start the gate on its release branch (request-release.sh)

# Own lock (2 Nov 2026): runs started on approval must not be cancelled by a queued PlotArt run sharing a lock. If the
# PlotArt pipeline moves main at the same moment, the push is refused (never forced) and the run retries once below.
concurrency:
  group: plotnua-ideas-publish
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}   # automation v1: request-release.sh dispatches the gate

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.pub.outputs.branch }}
      sha: ${{ steps.pub.outputs.sha }}
    timeout-minutes: 15   # the gated release is promoted by the job below, not waited for here
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Option B (founder decision 1 Nov 2026): the switch is "ideas_publish_enabled" in atlas-tools/release/flags.json on
      # main (a reviewed commit), or the repository variable IDEAS_PUBLISH_ENABLED. Off unless one of them says "true".
      - name: Is publishing switched on?
        id: on
        env:
          VAR: ${{ vars.IDEAS_PUBLISH_ENABLED }}
        run: |
          F=$(python3 -c 'import json; print(str(json.load(open("atlas-tools/release/flags.json")).get("ideas_publish_enabled", False)).lower())' 2>/dev/null || echo false)
          if [ "$VAR" = "true" ] || [ "$F" = "true" ]; then echo "on=1" >> "$GITHUB_OUTPUT"; echo "publishing on"; else echo "publishing is switched off: nothing to do"; fi
      # The Library guards the publisher runs include the card-image check, which needs Pillow (the same pinned version
      # as the image-rights gate and the PlotArt pipeline). Missing on launch night: fixed 2 Nov 2026.
      - name: Image tools (pinned, as the image rights gate)
        if: steps.on.outputs.on == '1'
        run: python3 -m pip install --quiet 'pillow==12.3.0'
      - name: Note where main is before publishing
        if: steps.on.outputs.on == '1'
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish approved ideas (content-only, guarded, fast-forward)
        id: pub
        if: steps.on.outputs.on == '1'
        env:
          STUDIO_URL: ${{ secrets.STUDIO_URL }}
          STUDIO_PIPELINE_TOKEN: ${{ secrets.STUDIO_PIPELINE_TOKEN }}
          STUDIO_ACCESS_CLIENT_ID: ${{ secrets.STUDIO_ACCESS_CLIENT_ID }}
          STUDIO_ACCESS_CLIENT_SECRET: ${{ secrets.STUDIO_ACCESS_CLIENT_SECRET }}
        run: |
          set -uo pipefail
          python3 atlas-tools/plotnua-ideas-publish.py --studio "$STUDIO_URL" --token "$STUDIO_PIPELINE_TOKEN" --push && exit 0
          echo "first attempt refused: retrying once on the latest main"
          sleep 20; git fetch -q origin main && git reset -q --hard origin/main
          python3 atlas-tools/plotnua-ideas-publish.py --studio "$STUDIO_URL" --token "$STUDIO_PIPELINE_TOKEN" --push
      - name: Request the GitHub Pages build when main moved
        if: steps.on.outputs.on == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ steps.before.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          AFTER=$(git rev-parse origin/main)
          if [ "$AFTER" != "$BEFORE" ]; then
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds" > /dev/null
            echo "main moved ${BEFORE:0:7} -> ${AFTER:0:7}: Pages build requested"
          else
            echo "nothing published: no Pages build requested"
          fi

  # Fix 5 Nov 2026. The gate this workflow starts runs with the built-in GitHub token, and GitHub never chains
  # "Release to production" (workflow_run) from runs started by that token, so approved ideas reached a release branch
  # but never main. This job promotes exactly that commit, through the same route as "Release to production": it waits
  # for the Image rights gate to pass on that exact commit, then runs promote.sh copied from main (fast-forward only,
  # refused if main moved, live check, automatic rollback). Main's ruleset still requires the gate on the commit.
  promote:
    needs: publish
    if: ${{ needs.publish.outputs.sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: production-site
      cancel-in-progress: false
    env:
      SHA: ${{ needs.publish.outputs.sha }}
      BRANCH: ${{ needs.publish.outputs.branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Trusted copy of the release tooling (from main)
        run: cp -r atlas-tools/release "$RUNNER_TEMP/release-tools"
      - name: Wait for the Image rights gate on this exact commit
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$BRANCH" == release/auto/ideas-* ]] || { echo "REFUSED: unexpected release request"; exit 1; }
          for i in $(seq 1 120); do
            R=$(gh run list -R "$GITHUB_REPOSITORY" -w image-rights-gate.yml --branch "$BRANCH" -L 5 \
                  --json headSha,status,conclusion -q "[.[] | select(.headSha == \"$SHA\")][0] | [.status, .conclusion] | @tsv" 2>/dev/null || true)
            case "$R" in
              completed$'\t'success) echo "gate passed on ${SHA:0:7}"; exit 0 ;;
              completed*) echo "REFUSED: the gate did not pass on ${SHA:0:7} ($R): nothing released"; exit 1 ;;
            esac
            sleep 15
          done
          echo "REFUSED: the gate did not finish within 30 minutes"; exit 1
      - name: Promote, verify live, roll back automatically if the live check fails
        run: |
          git config user.name "PlotNua release automation"; git config user.email "hello@plotnua.ie"
          bash "$RUNNER_TEMP/release-tools/promote.sh" "$SHA" "$BRANCH"
