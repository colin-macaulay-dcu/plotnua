# PlotNua — Garden Room recommendation universe: PRODUCTION REFRESH.
#
# Regenerates garden-room-recommendation-universe-v1.json from Atlas and, only
# if the result is valid AND actually different, commits it. This is the file
# the homeowner's browser loads first, so the whole design is arranged around
# one rule:
#
#   A FAILED OR QUESTIONABLE REFRESH MUST NEVER REPLACE THE LAST KNOWN-GOOD
#   PRODUCTION UNIVERSE.
#
# HOW THAT RULE IS ENFORCED, STRUCTURALLY RATHER THAN BY CARE.
#   The generator writes into ${RUNNER_TEMP}, outside the checked-out tree, and
#   refuses a directory holding production files anyway. The production JSON is
#   overwritten by exactly one step, which runs only after generation exited 0
#   and validation exited 0. Every other outcome leaves the file untouched and
#   fails the job loudly. There is no path that half-replaces it.
#
# WHY IT CANNOT LOOP.
#   The only triggers are a timer and a button. There is no `push` trigger, so
#   the commit this workflow makes cannot start it again.
#
# THE TOKEN.
#   ${{ secrets.AIRTABLE_TOKEN }} — the same repository secret atlas-stats.yml
#   has used since launch. It is handed to one step as an environment variable,
#   is never written to a file or an argument, and never reaches the artefact.
#   Airtable access is read-only: the generator issues GET requests only.
name: Atlas Match universe refresh

# PIECE 5B — THE DAILY SCHEDULE IS ON.
#
# Piece 5A ran this workflow against live Airtable by hand and the whole path
# held: live Atlas -> frozen generator -> temporary candidate -> validator ->
# NO CHANGE -> production untouched, no commit. 490 Garden Rooms, 490 eligible,
# 141 High Confidence, 274 confirmed Irish availability, 48 with no published
# Irish route. That run is why the timer is now allowed to do it unwatched.
#
# The manual trigger stays. It is how the next person reproduces a scheduled
# run when they need to see one.
on:
  schedule:
    # 06:15 UTC. Atlas statistics runs at 06:00; the quarter-hour stagger keeps
    # two jobs off the same Airtable rate-limit window.
    - cron: '15 6 * * *'
  workflow_dispatch:

# Least privilege. The job pushes one file; it needs nothing else.
permissions:
  contents: write

concurrency:
  group: atlas-match-universe-refresh
  cancel-in-progress: false

env:
  PRODUCTION_FILE: garden-room-recommendation-universe-v1.json
  # ISSUE 005 PIECE D4b — the long-form evidence a homeowner only reads after
  # opening Product Detail. Published alongside the core file, never instead of
  # it, and never without it.
  DETAIL_FILE: garden-room-detail-evidence-v1.json
  # ISSUE 005 PIECE E2 — the partition index. The runtime reads this to learn
  # which per-category files exist, so it never guesses a filename.
  DETAIL_INDEX: garden-room-detail-index-v1.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        # Standard library only. Nothing to install, nothing to pin.

      # Recorded BEFORE anything runs, so the final step can prove the file was
      # left alone rather than merely assert it.
      - name: Record the last known-good universe
        id: baseline
        run: |
          set -euo pipefail
          test -s "$PRODUCTION_FILE" || { echo "::error::production universe missing"; exit 1; }
          echo "sha=$(sha256sum "$PRODUCTION_FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "Last known-good: $(sha256sum "$PRODUCTION_FILE" | cut -c1-16)…  $(wc -c < "$PRODUCTION_FILE") bytes"
          # ISSUE 005 PIECE D4b — the detail artefact's last-known-good. It is
          # NOT required to exist: the first refresh after this Piece is the run
          # that creates it, and demanding it would fail that run.
          if [ -s "$DETAIL_FILE" ]; then
            echo "detail_sha=$(sha256sum "$DETAIL_FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            echo "Last known-good detail: $(sha256sum "$DETAIL_FILE" | cut -c1-16)…  $(wc -c < "$DETAIL_FILE") bytes"
          else
            echo "detail_sha=" >> "$GITHUB_OUTPUT"
            echo "No detail evidence artefact yet — this run may create the first one."
          fi

      - name: Create the candidate directory outside the repository
        id: outdir
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/atlas-match-universe-candidate"
          mkdir -p "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      # If this fails, the job stops here and production is untouched.
      - name: Generate a candidate universe from Atlas (read-only)
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          set -euo pipefail
          python .github/scripts/generate_garden_room_universe.py \
            --out-dir "${{ steps.outdir.outputs.path }}"

      - name: Verify the generator wrote nothing into the repository
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The generator modified the working tree. It must only write to its --out-dir."
            git status --porcelain
            exit 1
          fi

      # THE GATE. Exits non-zero on any structural or truthfulness failure, and
      # decides changed/unchanged. Nothing downstream runs if this fails.
      - name: Validate the candidate against production
        id: validate
        run: |
          set -euo pipefail
          python .github/scripts/validate_garden_room_universe.py \
            --candidate "${{ steps.outdir.outputs.path }}/$PRODUCTION_FILE" \
            --production "$PRODUCTION_FILE" \
            --summary-out "${{ steps.outdir.outputs.path }}/validation-summary.txt" \
            --github-output

      # ISSUE 005 PIECE D4b — THE SECOND GATE, AND IT RUNS BEFORE ANY COPY.
      # A separate validator for a separate contract. The core validator above
      # is untouched: this neither weakens it nor re-points it.
      - name: Validate the detail evidence candidate
        id: validate_detail
        run: |
          set -euo pipefail
          python .github/scripts/validate_garden_room_detail_evidence.py \
            --candidate "${{ steps.outdir.outputs.path }}/$DETAIL_FILE" \
            --production "$DETAIL_FILE" \
            --summary-out "${{ steps.outdir.outputs.path }}/detail-validation-summary.txt" \
            --github-output

      # ISSUE 005 PIECE E2 — the index, and through it every partition it names.
      # Same script, same exit code: a bad partition fails the job here, before
      # anything has been copied into the repository.
      - name: Validate the detail partition index and every partition
        id: validate_parts
        run: |
          set -euo pipefail
          python .github/scripts/validate_garden_room_detail_evidence.py \
            --candidate "${{ steps.outdir.outputs.path }}/$DETAIL_FILE" \
            --index "${{ steps.outdir.outputs.path }}/$DETAIL_INDEX" \
            --summary-out "${{ steps.outdir.outputs.path }}/partition-validation-summary.txt" \
            --output-prefix parts_ \
            --github-output

      # ATOMIC. Both artefacts are validated above; this publishes BOTH or
      # NEITHER, so production can never hold a fresh core beside a stale or
      # rejected detail file. It runs only when EITHER has genuinely changed —
      # 'generated' moves every run and is excluded from that test on both.
      - name: Publish the candidates, only if they are genuinely different
        if: >-
          steps.validate.outputs.valid == 'true' &&
          steps.validate_detail.outputs.detail_valid == 'true' &&
          steps.validate_parts.outputs.parts_valid == 'true' &&
          (steps.validate.outputs.changed == 'true' ||
           steps.validate_detail.outputs.detail_changed == 'true')
        run: |
          set -euo pipefail
          cp "${{ steps.outdir.outputs.path }}/$PRODUCTION_FILE" "$PRODUCTION_FILE"
          cp "${{ steps.outdir.outputs.path }}/$DETAIL_FILE" "$DETAIL_FILE"
          # ISSUE 005 PIECE E2 — the index and every partition, together. All of
          # them were validated above; none of them is copied unless all passed.
          cp "${{ steps.outdir.outputs.path }}/$DETAIL_INDEX" "$DETAIL_INDEX"
          for f in "${{ steps.outdir.outputs.path }}"/garden-room-detail-*-v1.json; do
            b="$(basename "$f")"
            [ "$b" = "$DETAIL_FILE" ] && continue
            [ "$b" = "$DETAIL_INDEX" ] && continue
            cp "$f" "$b"
          done

          # Stage the one approved path by explicit name. Never `git add -A`,
          # never `git add .`, never a wildcard: an unattended job must not be
          # able to sweep up an unrelated change that happens to be present.
          git add "$PRODUCTION_FILE" "$DETAIL_FILE" "$DETAIL_INDEX"
          # Bounded glob: the partition names are generated from the category
          # list, so they cannot be enumerated here without duplicating that
          # list. The second gate below still refuses anything outside the
          # approved shape, so this is bounded rather than a wildcard sweep.
          git add -- 'garden-room-detail-*-v1.json'

          if git diff --cached --quiet; then
            echo "Nothing staged after all — leaving production as it stands."
            exit 0
          fi

          # Second gate. Every staged path must be one of the two approved
          # names. Either may be unchanged on a given run — only one file may
          # have moved — so this checks membership rather than an exact pair.
          APPROVED=" $PRODUCTION_FILE $DETAIL_FILE $DETAIL_INDEX "
          STAGED="$(git diff --cached --name-only | sort | tr '\n' ' ')"
          for path in $STAGED; do
            case "$APPROVED" in
              *" $path "*) continue ;;
            esac
            # ISSUE 005 PIECE E2 — a partition is approved only if it matches the
            # generated shape exactly. Anything else fails the job.
            case "$path" in
              garden-room-detail-*-v1.json) continue ;;
            esac
            echo "::error::Unexpected staged path: $path"; exit 1
          done

          git -c user.name='plotnua-atlas-bot' \
              -c user.email='atlas-bot@users.noreply.github.com' \
              commit -m 'Atlas: refresh Garden Room recommendation universe and detail evidence'
          git push

      - name: Confirm both artefacts were left untouched when nothing changed
        if: >-
          steps.validate.outputs.changed != 'true' &&
          steps.validate_detail.outputs.detail_changed != 'true'
        run: |
          set -euo pipefail
          NOW="$(sha256sum "$PRODUCTION_FILE" | cut -d' ' -f1)"
          if [ "$NOW" != "${{ steps.baseline.outputs.sha }}" ]; then
            echo "::error::The production universe changed on a run that should not have touched it."
            exit 1
          fi
          # ISSUE 005 PIECE D4b — the same protection for the second artefact.
          # Absent is allowed: the detail file does not exist until the first
          # refresh that produces it, and a missing baseline is not a change.
          if [ -n "${{ steps.baseline.outputs.detail_sha }}" ]; then
            NOWD="$(sha256sum "$DETAIL_FILE" | cut -d' ' -f1)"
            if [ "$NOWD" != "${{ steps.baseline.outputs.detail_sha }}" ]; then
              echo "::error::The detail evidence changed on a run that should not have touched it."
              exit 1
            fi
          fi
          echo "NO CHANGE — both artefacts already current, and byte-identical to the run's start."

      # Debugging aid for a hand-run refresh. Deliberately NOT the delivery
      # mechanism: Piece 4 was blocked for a day because the only copy of a
      # generated universe lived in an Actions artefact. Production truth is
      # the committed repository file and nothing else.
      - name: Keep the candidate and its validation for manual runs
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: garden-room-universe-candidate
          path: |
            ${{ steps.outdir.outputs.path }}/garden-room-recommendation-universe-v1.json
            ${{ steps.outdir.outputs.path }}/garden-room-exclusions-v1.json
            ${{ steps.outdir.outputs.path }}/garden-room-qualification-report.txt
            ${{ steps.outdir.outputs.path }}/garden-room-detail-evidence-v1.json
            ${{ steps.outdir.outputs.path }}/validation-summary.txt
            ${{ steps.outdir.outputs.path }}/detail-validation-summary.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Write the run summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo '## Garden Room recommendation universe — refresh'
            echo ''
            if [ -s "${{ steps.outdir.outputs.path }}/validation-summary.txt" ]; then
              echo '```'
              cat "${{ steps.outdir.outputs.path }}/validation-summary.txt"
              echo '```'
              if [ -s "${{ steps.outdir.outputs.path }}/detail-validation-summary.txt" ]; then
                echo '```'
                cat "${{ steps.outdir.outputs.path }}/detail-validation-summary.txt"
                echo '```'
              fi
            else
              echo 'No validation summary — generation did not complete. Production universe untouched.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
