# PlotNua public site on Cloudflare · TEST deploy only (prepared 27 Nov 2026, development and testing approved).
#
# Builds plotnua.ie from the repository through the fail-closed publication allowlist (worker/plotnua-site/
# publish-allowlist.txt) and deploys it to the plotnua-site Worker on its workers.dev address only, which is always
# noindexed. plotnua.ie itself stays on GitHub Pages: this workflow attaches no domain, changes no DNS and touches
# neither the PlotArt Worker nor GitHub Pages. It is a separate Worker with its own environment, so a deploy here
# cannot affect plotart.ie, and a plotart.ie deploy cannot affect this.
#
#   * Manual runs only (Actions -> "PlotNua site test deploy" -> Run workflow). No push trigger until a cutover is approved.
#   * verify (default): build, allowlist, 1,700 local proofs, Wrangler dry run. Deploys nothing.
#   * deploy: a deliberate manual run with mode = deploy. It uses the EXISTING Cloudflare credential in the "plotart-site"
#     environment (main branch only; account-level Workers Scripts Edit, the narrowest Cloudflare offers: a token cannot
#     be limited to one Worker, so a second token would grant exactly the same power and add nothing but upkeep).
#     It can only ever deploy the plotnua-site Worker to its noindexed workers.dev address: wrangler.toml attaches no
#     route or custom domain, and this workflow refuses one. After the deploy, the workers.dev address is checked; a
#     failure rolls the Worker back automatically.
#   * compare: the live parity check, GitHub Pages (plotnua.ie) against the Worker (workers.dev), file by file.
#   * ref (default main): a development branch (dev/...) may be built and deployed to the workers.dev test address, so a
#     change (for example the consent migration) is tested on Cloudflare BEFORE it is released. The workflow itself, its
#     refusals (no route, no domain, workers.dev only) and the credential's main-only environment always come from main.
# Logs are public: no step prints a credential or an account identifier.
name: PlotNua site test deploy (workers.dev only)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify = build and prove (deploys nothing); deploy = test deploy to workers.dev; compare = Pages vs Worker parity'
        type: choice
        options: [verify, deploy, compare]
        default: verify
      ref:
        description: 'what to build: main (default), or a development branch dev/... to TEST on workers.dev before it is released'
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: plotnua-site-deploy
  cancel-in-progress: false

env:
  WORKERS_DEV: https://plotnua-site.colin-a41.workers.dev

jobs:
  site:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: plotart-site   # the existing Cloudflare credential (see above); main branch only
    steps:
      - name: Only main or a development branch may be built
        env:
          REF: ${{ inputs.ref }}
        run: |
          [[ "$REF" == main || "$REF" =~ ^dev/[A-Za-z0-9._/-]+$ ]] || { echo "FAIL  ref must be main or dev/..."; exit 1; }
          echo "Building: $REF" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build through the publication allowlist and prove it (nothing is deployed)
        run: |
          python3 atlas-tools/plotnua_site_build.py . worker/plotnua-site/dist --mode test
          node worker/plotnua-site/test/prove-site.mjs "$GITHUB_WORKSPACE/worker/plotnua-site/dist" "$GITHUB_WORKSPACE" | tail -3
      - name: Privacy regression test and consent events (nothing before consent or after Reject; measurement after Accept)
        run: |
          set -o pipefail
          # active once the PlotNua consent migration is on main (its privacy baseline and events proof arrive with it)
          [ -f worker/plotnua-site/privacy.json ] || { echo "PlotNua privacy baseline not on main yet: skipped" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          npm install --prefix atlas-tools --no-save --no-package-lock --silent playwright@1.63.0 > /dev/null
          (cd atlas-tools && npx playwright install --with-deps chromium > /dev/null)
          node atlas-tools/serve-site-local.mjs "$GITHUB_WORKSPACE/worker/plotnua-site/src/index.js" "$GITHUB_WORKSPACE/worker/plotnua-site/dist" index &
          sleep 2
          node atlas-tools/prove-privacy.mjs worker/plotnua-site/privacy.json http://127.0.0.1:8799 --pages-from worker/plotnua-site/dist --choice-pages 12 | tee -a "$GITHUB_STEP_SUMMARY"
          node atlas-tools/prove-plotnua-consent-events.mjs http://127.0.0.1:8799 | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Wrangler dry run
        if: inputs.mode == 'verify'
        working-directory: worker/plotnua-site
        run: |
          npx --yes wrangler@4.150.0 deploy --dry-run --outdir "$RUNNER_TEMP/build" > "$RUNNER_TEMP/w.log" 2>&1 || { tail -8 "$RUNNER_TEMP/w.log" | grep -viE "token|account"; exit 1; }
      - name: Test deploy (workers.dev only)
        if: inputs.mode == 'deploy'
        working-directory: worker/plotnua-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if grep -Eq '^\s*(routes?|custom_domain)\s*=|^\[\[routes\]\]' wrangler.toml; then echo "FAIL  wrangler.toml declares a route or domain; test deploys are workers.dev only"; exit 1; fi
          grep -Eq '^workers_dev = true' wrangler.toml || { echo "FAIL  workers_dev must be true for a test deploy"; exit 1; }
          npx --yes wrangler@4.150.0 deploy --message "test ${GITHUB_SHA::12}" > "$RUNNER_TEMP/w.log" 2>&1 \
            || { echo "FAIL  the deployment did not complete"; grep -iE "error|permission" "$RUNNER_TEMP/w.log" | grep -viE "token|https?://" | head -5; exit 1; }
          grep -E "^Uploaded |^Current Version ID" "$RUNNER_TEMP/w.log" || true
      - name: Live check (workers.dev is noindexed and serves the build)
        id: live
        if: inputs.mode == 'deploy'
        run: |
          sleep 20
          curl -fsSI "$WORKERS_DEV/" | grep -qi '^x-robots-tag: noindex' || { echo "FAIL  workers.dev is not noindexed"; exit 1; }
          curl -fsSI "$WORKERS_DEV/assets/consent/site-consent.js" | grep -qi '^x-robots-tag: noindex' || { echo "FAIL  assets are not noindexed"; exit 1; }
          echo "PASS  workers.dev serves the site, noindexed"
      - name: Automatic rollback (live check failed)
        if: failure() && steps.live.outcome == 'failure'
        working-directory: worker/plotnua-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.150.0 rollback --yes --message "automatic rollback after failed live check" > /dev/null 2>&1 && echo "Rolled back" || echo "Rollback failed: check the Cloudflare dashboard"
      - name: Live parity, GitHub Pages vs the Worker
        if: inputs.mode == 'compare'
        run: |
          node atlas-tools/compare-plotnua-hosting.mjs worker/plotnua-site/dist https://plotnua.ie "$WORKERS_DEV" --report "$RUNNER_TEMP/parity.json"
