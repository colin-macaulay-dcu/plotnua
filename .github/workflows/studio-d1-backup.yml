# PlotArt Studio · scheduled database backup (automation v1, prepared 1 Nov 2026). READ-ONLY on the database.
#
# Weekly, and on demand: records a Cloudflare Time Travel restore point and takes a full export of plotart-studio,
# encrypted on the runner (AES-256, key = STUDIO_BACKUP_PASSPHRASE) and verified to decrypt, kept as a 90-day artifact.
# The unencrypted export never leaves the runner and is shredded. It also checks the export contains every table the
# Studio needs, so a missing table is noticed. On failure it opens (or updates) a GitHub issue labelled "ops-alert".
# Runs in environment studio-database-auto (main only, no reviewer): reading and exporting is not a change.
name: Studio database backup
on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: plotart-studio-cloudflare
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: studio-database-auto
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Production configuration (identifiers from the environment, never printed)
        env:
          STUDIO_D1_DATABASE_ID: ${{ vars.STUDIO_D1_DATABASE_ID }}
          STUDIO_ACCESS_AUD: ${{ vars.STUDIO_ACCESS_AUD }}
          STUDIO_ACCESS_TEAM: ${{ vars.STUDIO_ACCESS_TEAM }}
        run: python3 atlas-tools/release/studio/render-config.py worker/plotart-studio
      - name: Time Travel restore point
        working-directory: worker/plotart-studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STUDIO_CF_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.150.0 d1 time-travel info plotart-studio --json --config wrangler.production.toml > "$RUNNER_TEMP/tt.json" 2>/dev/null || { echo "FAIL  no restore point"; exit 1; }
          B=$(node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8");const m=s.match(/"bookmark"\s*:\s*"([^"]+)"/);if(!m)process.exit(1);console.log(m[1])' "$RUNNER_TEMP/tt.json") || { echo "FAIL  no restore point"; exit 1; }
          echo "- Restore point (Time Travel bookmark): \`$B\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Full export, encrypted and verified
        working-directory: worker/plotart-studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STUDIO_CF_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_KEY: ${{ secrets.STUDIO_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          [ "${#BACKUP_KEY}" -ge 24 ] || { echo "FAIL  the backup passphrase is missing or too short"; exit 1; }
          npx --yes wrangler@4.150.0 d1 export plotart-studio --remote --config wrangler.production.toml --output "$RUNNER_TEMP/backup.sql" > /dev/null 2>&1 || { echo "FAIL  the export failed"; exit 1; }
          for t in artists artworks images submissions versions publish_queue audit; do grep -qiE "CREATE TABLE [\`\"]?$t\b" "$RUNNER_TEMP/backup.sql" || { echo "FAIL  table $t missing from the export"; shred -u "$RUNNER_TEMP/backup.sql"; exit 1; }; done
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$RUNNER_TEMP/backup.sql" -out "$RUNNER_TEMP/studio-d1-backup.sql.enc" -pass env:BACKUP_KEY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$RUNNER_TEMP/studio-d1-backup.sql.enc" -pass env:BACKUP_KEY | cmp -s - "$RUNNER_TEMP/backup.sql" || { echo "FAIL  the encrypted backup does not decrypt to the export"; exit 1; }
          shred -u "$RUNNER_TEMP/backup.sql"
          C=$(sha256sum "$RUNNER_TEMP/studio-d1-backup.sql.enc" | cut -c1-64)
          echo "encrypted backup verified · checksum $C"
          echo "- Encrypted full backup: artifact \`studio-d1-weekly-${{ github.run_id }}\` (90 days), SHA-256 \`$C\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: studio-d1-weekly-${{ github.run_id }}
          path: ${{ runner.temp }}/studio-d1-backup.sql.enc
          retention-days: 90
          if-no-files-found: error
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash atlas-tools/release/ops-alert.sh "Studio database backup failed" "The weekly backup run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed. Nothing was changed in the database."
