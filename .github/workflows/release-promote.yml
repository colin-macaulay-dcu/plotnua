# PlotNua · automatic release of the website (automation v1, prepared 1 Nov 2026; active only once merged to main with
# the founder's approval of the automation policy).
#
# How a website release happens without anyone opening GitHub:
#   1. Claude finishes and tests a founder-authorised change and pushes it to a branch named release/auto/<topic>.
#   2. The Image rights gate (every governed check) runs on that exact commit.
#   3. Only if it succeeds, this workflow fast-forwards main to that commit: never forced, refused if main has moved
#      (the release branch must contain the current main), and refused for any commit already behind main.
#   4. It requests the GitHub Pages build, waits for it, and runs the site health check against that commit (the live
#      files must be byte-identical to the commit).
#   5. If the live check fails, it restores the previous site automatically: a revert commit on top (fast-forward,
#      never a reset), a new Pages build and a second check, and it opens an "ops-alert" issue.
#   6. Every release is tagged prod/<UTC time>-<sha> and summarised in the run summary: the audit trail.
# Worker and database changes are NOT released here: they keep their own workflows.
name: Release to production
on:
  workflow_run:
    workflows: ["Image rights gate"]
    types: [completed]

permissions:
  contents: write
  pages: write
  issues: write

concurrency:
  group: production-site
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'release/auto/')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      # The release tooling is copied from MAIN before anything else happens, so a release branch can never change
      # how it is itself checked, promoted or rolled back.
      - name: Trusted copy of the release tooling (from main)
        run: cp -r atlas-tools/release "$RUNNER_TEMP/release-tools"
      - name: Promote, verify live, roll back automatically if the live check fails
        id: promote
        run: |
          git config user.name "PlotNua release automation"; git config user.email "hello@plotnua.ie"
          bash "$RUNNER_TEMP/release-tools/promote.sh" "$SHA" "$BRANCH"
      - name: Alert on failure
        if: failure()
        run: |
          bash "$RUNNER_TEMP/release-tools/ops-alert.sh" "Website release failed" "Release of ${SHA} from ${BRANCH} did not complete, see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
