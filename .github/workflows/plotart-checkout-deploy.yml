# PlotArt · managed checkout pilot · Worker deployment (prepared 16 Nov 2026). NOT RUN. NEVER A DATABASE CHANGE.
#
# Two separate targets that share nothing but code:
#   test        GitHub environment "checkout-test": Workers plotart-studio-test and plotart-checkout-test, the TEST database
#               plotart-checkout-test, TEST R2 buckets, a TEST Access application, Stripe TEST credentials only. The pilot is
#               switched on only if enable_test_pilot is ticked. Placeholder texts marked TEST ONLY are bundled.
#   production  GitHub environment "studio-production.": Worker plotart-checkout on the production database. The pilot is OFF
#               and no Stripe secret is written, UNLESS enable_live_pilot is ticked AND live_confirmation is exactly
#               "ENABLE LIVE PLOTART CHECKOUT" (20 Nov 2026). Then, fail-closed (checkout-live-enable.sh): LIVE credentials
#               checked (test values refused); plotart-checkout deployed OFF; every LIVE secret written and verified on
#               both Workers; only then the LIVE deployment and an outside check of live mode. Any failure redeploys OFF,
#               removes the Studio's live key (confirmed from a readable secret list) and verifies OFF from outside.
#               Every production run WITHOUT enable_live_pilot actively switches checkout OFF the same way
#               (checkout-live-off.sh): that is the way to disable a live deployment. A run that stops before deploying
#               (guards, configuration, the live credentials check) changes nothing: it refuses the new activation and
#               leaves whatever is deployed as it was. The same founder Approve on the environment is required for every
#               production run.
# Migrations are never applied here: production migrations go through studio-d1-migration.yml; the test database is set up
# by the documented commands in worker/plotart-studio/MANAGED-CHECKOUT-PILOT.md ("Test environment").
# Every run waits for the founder's Approve on its environment. Logs show only names, switches and PASS/FAIL.
name: PlotArt checkout pilot deploy
run-name: "Checkout pilot deploy ${{ inputs.target }} ${{ inputs.commit }}${{ inputs.dry_run && ' (dry run)' || '' }}"

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Full 40-character commit ID approved by the founder (must be on main)"
        required: true
        type: string
      target:
        description: "test (separate test Workers and database) or production (pilot always off)"
        required: true
        type: choice
        options: [test, production]
        default: test
      dry_run:
        description: "Dry run: guards, configuration and build only; nothing sent to Cloudflare"
        required: true
        type: boolean
        default: true
      enable_test_pilot:
        description: "TEST target only: switch the pilot on in the test Workers (Stripe test mode)"
        required: false
        type: boolean
        default: false
      enable_live_pilot:
        description: "PRODUCTION target only: enable LIVE checkout (real card payments). Needs live_confirmation too"
        required: false
        type: boolean
        default: false
      live_confirmation:
        description: "Type exactly ENABLE LIVE PLOTART CHECKOUT to confirm live checkout (ignored unless enable_live_pilot)"
        required: false
        type: string
        default: ""
      enable_live_basket:
        description: "PRODUCTION + live only: also open the multi-artist basket (refused unless approved LIVE basket texts are bundled)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.target == 'production' && 'plotart-studio-cloudflare' || 'plotart-checkout-test' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guards · commit on main, pilot shipped off, live gate in code, live only by the explicit production path
        env:
          COMMIT: ${{ inputs.commit }}
          TARGET: ${{ inputs.target }}
          ENABLE: ${{ inputs.enable_test_pilot && 'true' || 'false' }}
          LIVE: ${{ inputs.enable_live_pilot && 'true' || 'false' }}
          LIVE_CONFIRMATION: ${{ inputs.live_confirmation }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "REFUSED: give the full 40-character commit ID"; exit 1; }
          git merge-base --is-ancestor "$COMMIT" origin/main || { echo "REFUSED: $COMMIT is not on main"; exit 1; }
          git show "$COMMIT:worker/plotart-studio/wrangler.checkout.toml" | grep -q '^CHECKOUT_PILOT_ENABLED = "false"' || { echo "REFUSED: wrangler.checkout.toml must ship the pilot off"; exit 1; }
          git show "$COMMIT:worker/plotart-studio/wrangler.toml" | grep -q '^CHECKOUT_PILOT_ENABLED = "false"' || { echo "REFUSED: wrangler.toml must ship the pilot off"; exit 1; }
          git show "$COMMIT:worker/plotart-studio/src/stripe.js" | grep -qF "Live checkout can be enabled only in the production environment" || { echo "REFUSED: the Stripe adapter no longer has the production-only live gate"; exit 1; }
          git show "$COMMIT:worker/plotart-studio/src/stripe.js" | grep -qF "a Stripe TEST key is refused in production" || { echo "REFUSED: the Stripe adapter no longer refuses TEST keys in production"; exit 1; }
          git show "$COMMIT:worker/plotart-studio/production.json" | python3 -c 'import json,sys; v=json.load(sys.stdin)["vars"]; sys.exit(1 if any(k.startswith("CHECKOUT_") or k in ("SANDBOX","STRIPE_API_BASE") for k in v) else 0)' || { echo "REFUSED: production.json sets checkout switches outside its checkout_live block"; exit 1; }
          if [ "$TARGET" = production ] && [ "$ENABLE" = true ]; then echo "REFUSED: the TEST pilot cannot be switched on in production"; exit 1; fi
          if [ "$LIVE" = true ] && [ "$TARGET" != production ]; then echo "REFUSED: live checkout can be enabled only for the production target"; exit 1; fi
          if [ "$LIVE" = true ] && [ "$LIVE_CONFIRMATION" != "ENABLE LIVE PLOTART CHECKOUT" ]; then echo "REFUSED: live checkout needs the exact confirmation phrase"; exit 1; fi
          if [ "$LIVE" = true ]; then git show "$COMMIT:worker/plotart-studio/agreements/payment-issued/fingerprints.json" > /dev/null 2>&1 || { echo "REFUSED: live checkout needs the issued payment texts (agreements/payment-issued)"; exit 1; }; fi
          echo "GUARD OK · $TARGET · $COMMIT" | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'production' && 'studio-production.' || 'checkout-test' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check again after approval
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git fetch -q origin main
          git merge-base --is-ancestor "$COMMIT" origin/main || { echo "REFUSED: $COMMIT is not on main"; exit 1; }
          test "$(git rev-parse HEAD)" = "$COMMIT" || { echo "REFUSED: the checked-out tree is not $COMMIT"; exit 1; }

      # ---------------------------------------------------------------- TEST
      - name: TEST · build with the TEST ONLY placeholder texts
        if: ${{ inputs.target == 'test' }}
        working-directory: worker/plotart-studio
        env:
          CHECKOUT_TARGET: test
          PAYMENT_TERMS_DIR: agreements/payment-test
        run: node build-assets.mjs
      - name: TEST · configuration (identifiers from the checkout-test environment, never printed)
        if: ${{ inputs.target == 'test' }}
        env:
          CHECKOUT_TEST_D1_DATABASE_ID: ${{ vars.CHECKOUT_TEST_D1_DATABASE_ID }}
          CHECKOUT_TEST_ACCESS_AUD: ${{ vars.CHECKOUT_TEST_ACCESS_AUD }}
          CHECKOUT_TEST_ACCESS_TEAM: ${{ vars.CHECKOUT_TEST_ACCESS_TEAM }}
          CHECKOUT_TEST_ORIGIN: ${{ vars.CHECKOUT_TEST_ORIGIN }}
          ENABLE_TEST_PILOT: ${{ inputs.enable_test_pilot && 'true' || 'false' }}
        run: python3 atlas-tools/release/studio/render-checkout-config.py worker/plotart-studio test
      - name: TEST · Stripe credentials are TEST credentials (values never printed)
        if: ${{ inputs.target == 'test' }}
        env:
          STRIPE_SECRET_KEY: ${{ secrets.CHECKOUT_TEST_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.CHECKOUT_TEST_STRIPE_WEBHOOK_SECRET }}
        run: bash atlas-tools/release/studio/check-stripe-test-secrets.sh
      - name: TEST · build only (dry run)
        if: ${{ inputs.target == 'test' && inputs.dry_run }}
        working-directory: worker/plotart-studio
        run: |
          set -o pipefail
          for c in wrangler.studio.test.toml wrangler.checkout.test.toml; do
            npx --yes wrangler@4.150.0 deploy --config "$c" --dry-run --outdir "$RUNNER_TEMP/build-$c" > "$RUNNER_TEMP/wrangler.log" 2>&1 || { python3 "$GITHUB_WORKSPACE/atlas-tools/release/studio/wrangler-error.py" "$RUNNER_TEMP/wrangler.log"; exit 1; }
          done
          echo "DRY RUN OK: both TEST Workers build; nothing was sent to Cloudflare"
      - name: TEST · deploy plotart-studio-test and plotart-checkout-test, then write their TEST secrets
        id: test_deploy
        if: ${{ inputs.target == 'test' && !inputs.dry_run }}
        working-directory: worker/plotart-studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CHECKOUT_TEST_CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.CHECKOUT_TEST_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.CHECKOUT_TEST_STRIPE_WEBHOOK_SECRET }}
          FOUNDER_EMAILS: ${{ secrets.CHECKOUT_TEST_FOUNDER_EMAILS }}
        run: |
          set -o pipefail
          W="npx --yes wrangler@4.150.0"
          for c in wrangler.studio.test.toml wrangler.checkout.test.toml; do
            $W deploy --config "$c" > "$RUNNER_TEMP/wrangler.log" 2>&1 || { echo "FAIL  $c did not deploy"; python3 "$GITHUB_WORKSPACE/atlas-tools/release/studio/wrangler-error.py" "$RUNNER_TEMP/wrangler.log"; exit 1; }
            grep -E "^Current Version ID" "$RUNNER_TEMP/wrangler.log" || true
          done
          printf '%s' "$STRIPE_SECRET_KEY" | $W secret put STRIPE_SECRET_KEY --config wrangler.studio.test.toml > /dev/null
          printf '%s' "$FOUNDER_EMAILS"    | $W secret put FOUNDER_EMAILS    --config wrangler.studio.test.toml > /dev/null
          printf '%s' "$STRIPE_SECRET_KEY" | $W secret put STRIPE_SECRET_KEY --config wrangler.checkout.test.toml > /dev/null
          printf '%s' "$STRIPE_WEBHOOK_SECRET" | $W secret put STRIPE_WEBHOOK_SECRET --config wrangler.checkout.test.toml > /dev/null
          echo "- TEST Workers deployed; TEST secrets written (values not shown)" >> "$GITHUB_STEP_SUMMARY"
      - name: TEST · checked from outside (nothing is created)
        id: test_live
        if: ${{ inputs.target == 'test' && !inputs.dry_run }}
        env:
          ORIGIN: ${{ vars.CHECKOUT_TEST_ORIGIN }}
          MODE: ${{ inputs.enable_test_pilot && 'on' || 'off' }}
        run: sleep 10 && bash atlas-tools/release/studio/checkout-outside-check.sh "$ORIGIN" "$MODE"
      - name: TEST · roll back both Workers after a failed check
        if: ${{ failure() && inputs.target == 'test' && steps.test_deploy.outcome == 'success' && steps.test_live.outcome == 'failure' }}
        working-directory: worker/plotart-studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CHECKOUT_TEST_CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for c in wrangler.checkout.test.toml wrangler.studio.test.toml; do
            npx --yes wrangler@4.150.0 rollback --config "$c" --message "automatic rollback (run ${{ github.run_id }})" -y > /dev/null 2>&1 && echo "rolled back $c" || echo "FAIL  rollback of $c"
          done

      # ---------------------------------------------------------------- PRODUCTION (OFF by default; live only with enable_live_pilot and its confirmation)
      - name: PRODUCTION · build with the issued texts only (refuses TEST placeholders)
        if: ${{ inputs.target == 'production' }}
        working-directory: worker/plotart-studio
        run: |
          set -euo pipefail
          node build-assets.mjs
          ! grep -q "TEST ONLY" src/payment-terms.js || { echo "REFUSED: a TEST placeholder is in the production build"; exit 1; }
      - name: PRODUCTION · configuration (pilot off unless live checkout is explicitly enabled)
        if: ${{ inputs.target == 'production' }}
        env:
          STUDIO_D1_DATABASE_ID: ${{ vars.STUDIO_D1_DATABASE_ID }}
          CHECKOUT_PRODUCTION_ORIGIN: ${{ vars.CHECKOUT_PRODUCTION_ORIGIN }}
          CHECKOUT_LIVE_MAIL_FROM: ${{ vars.CHECKOUT_LIVE_MAIL_FROM }}
          CHECKOUT_LIVE_NOTIFY_EMAIL: ${{ vars.CHECKOUT_LIVE_NOTIFY_EMAIL }}
          ENABLE_TEST_PILOT: "false"
          ENABLE_LIVE_PILOT: ${{ inputs.enable_live_pilot && 'true' || 'false' }}
          LIVE_CONFIRMATION: ${{ inputs.live_confirmation }}
          ENABLE_LIVE_BASKET: ${{ inputs.enable_live_basket && 'true' || 'false' }}
          # the publishable key is not a secret; accepted as an environment variable or, if saved that way, an environment secret
          CHECKOUT_LIVE_PUBLISHABLE_KEY: ${{ vars.CHECKOUT_LIVE_PUBLISHABLE_KEY || secrets.CHECKOUT_LIVE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          # always render the OFF configuration first and keep it: the live path deploys it before any secret is written,
          # and every recovery redeploys it
          ENABLE_LIVE_PILOT=false LIVE_CONFIRMATION= ENABLE_LIVE_BASKET=false python3 atlas-tools/release/studio/render-checkout-config.py worker/plotart-studio production
          cp worker/plotart-studio/wrangler.checkout.production.toml worker/plotart-studio/wrangler.checkout.production.off.toml
          python3 atlas-tools/release/studio/render-checkout-config.py worker/plotart-studio production
      - name: PRODUCTION · LIVE credentials are LIVE credentials, never the TEST ones (values never printed)
        if: ${{ inputs.target == 'production' && inputs.enable_live_pilot }}
        env:
          LIVE_STUDIO_KEY: ${{ secrets.CHECKOUT_LIVE_STRIPE_STUDIO_KEY }}
          LIVE_RUNTIME_KEY: ${{ secrets.CHECKOUT_LIVE_STRIPE_RUNTIME_KEY }}
          LIVE_WEBHOOK_SECRET: ${{ secrets.CHECKOUT_LIVE_STRIPE_WEBHOOK_SECRET }}
          LIVE_RESEND_KEY: ${{ secrets.CHECKOUT_LIVE_RESEND_API_KEY }}
          ENABLE_LIVE_BASKET: ${{ inputs.enable_live_basket && 'true' || 'false' }}
          LIVE_BASKET_KEY: ${{ secrets.CHECKOUT_LIVE_STRIPE_BASKET_KEY }}
          LIVE_PLATFORM_WEBHOOK_SECRET: ${{ secrets.CHECKOUT_LIVE_STRIPE_PLATFORM_WEBHOOK_SECRET }}
        run: bash atlas-tools/release/studio/check-stripe-live-secrets.sh
      - name: PRODUCTION · build only (dry run)
        if: ${{ inputs.target == 'production' && inputs.dry_run }}
        working-directory: worker/plotart-studio
        run: |
          set -o pipefail
          npx --yes wrangler@4.150.0 deploy --config wrangler.checkout.production.off.toml --dry-run --outdir "$RUNNER_TEMP/build-off" > "$RUNNER_TEMP/wrangler.log" 2>&1 || { grep -iE "error" "$RUNNER_TEMP/wrangler.log" | head -5; exit 1; }
          npx --yes wrangler@4.150.0 deploy --config wrangler.checkout.production.toml --dry-run --outdir "$RUNNER_TEMP/build" > "$RUNNER_TEMP/wrangler.log" 2>&1 || { grep -iE "error" "$RUNNER_TEMP/wrangler.log" | head -5; exit 1; }
          echo "DRY RUN OK: plotart-checkout builds with the pilot off; nothing was sent to Cloudflare"
      - name: PRODUCTION · switch plotart-checkout OFF and verify (deploy OFF, no Studio live key, OFF checked from outside)
        id: prod_off
        if: ${{ inputs.target == 'production' && !inputs.dry_run && !inputs.enable_live_pilot }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STUDIO_CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ORIGIN: ${{ vars.CHECKOUT_PRODUCTION_ORIGIN }}
        run: bash atlas-tools/release/studio/checkout-live-off.sh worker/plotart-studio wrangler.checkout.production.off.toml
      - name: PRODUCTION · enable LIVE checkout, fail-closed (OFF deploy, secrets, verify, then the LIVE deploy; any failure recovers to OFF)
        id: prod_live_enable
        if: ${{ inputs.target == 'production' && !inputs.dry_run && inputs.enable_live_pilot }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STUDIO_CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ORIGIN: ${{ vars.CHECKOUT_PRODUCTION_ORIGIN }}
          LIVE_STUDIO_KEY: ${{ secrets.CHECKOUT_LIVE_STRIPE_STUDIO_KEY }}
          LIVE_RUNTIME_KEY: ${{ secrets.CHECKOUT_LIVE_STRIPE_RUNTIME_KEY }}
          LIVE_WEBHOOK_SECRET: ${{ secrets.CHECKOUT_LIVE_STRIPE_WEBHOOK_SECRET }}
          LIVE_RESEND_KEY: ${{ secrets.CHECKOUT_LIVE_RESEND_API_KEY }}
          ENABLE_LIVE_BASKET: ${{ inputs.enable_live_basket && 'true' || 'false' }}
          LIVE_PLATFORM_WEBHOOK_SECRET: ${{ secrets.CHECKOUT_LIVE_STRIPE_PLATFORM_WEBHOOK_SECRET }}
          LIVE_BASKET_KEY: ${{ secrets.CHECKOUT_LIVE_STRIPE_BASKET_KEY }}
        run: bash atlas-tools/release/studio/checkout-live-enable.sh worker/plotart-studio
