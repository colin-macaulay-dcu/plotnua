name = "plotnua-art-space-register"
main = "src/index.js"
compatibility_date = "2026-10-07"

workers_dev = true      # plotnua.ie is not on Cloudflare; the page calls this
                        # Worker's workers.dev origin directly.
preview_urls = false    # one endpoint, not a family of live hostnames.

[vars]
# ---------------------------------------------------------------------------
# ART SPACE REGISTER · OPEN. Founder approval to open: 14 October 2026, after
# the controlled registration-and-deletion test of the same day
# (OPEN_APPROVAL in atlas-tools/build-art-space-register.py). Guard R2 refuses
# WRITES_ENABLED = "true" unless the register page is open and approved.
# To CLOSE fast: set WRITES_ENABLED = "false" and `npx wrangler deploy`
# (the page then answers "not open"); revoke the token for a hard stop.
# EMAIL_ENABLED stays off: there is no mail adapter. Writes are bounded by
# the Worker's durable 25-per-day cap. This Worker shares NO binding, base or
# credential with worker/garden-register.
# ---------------------------------------------------------------------------
WRITES_ENABLED  = "true"
EMAIL_ENABLED   = "false"   # there is NO mail adapter in this Worker.
ORIGIN          = "https://plotnua.ie"
# The privacy notice version that will carry the Art Space Register section.
# DRAFT — governance/PRIVACY-VERSION-2026-10-PHASE2-V4-DRAFT.md. It must be
# approved AND published on plotnua.ie before writes are ever enabled.
PRIVACY_VERSION = "2026-10-PHASE2-V5"

# ---------------------------------------------------------------------------
# ARTIST REGISTER (PlotArt) · OPEN. Founder approval to BUILD: 14 Oct 2026;
# founder approval to OPEN: 14 Oct 2026 (20:33). Takes effect on deploy only.
# Emergency close without a commit: npx wrangler deploy --var ARTIST_WRITES_ENABLED:false
# A separate route (/v1/art-space-register/artist), a separate switch and a
# separate privacy version. The homeowner switch above does NOT open it.
# Guard A2 in atlas-tools/build-artist-register.py refuses
# ARTIST_WRITES_ENABLED = "true" until Privacy Notice V5 is published, the
# artist page is open and ARTIST_OPEN_APPROVAL is complete.
# ARTIST_PRIVACY_VERSION names the notice that covers artists (V5, published). The artist route writes nothing while either is missing.
# ---------------------------------------------------------------------------
ARTIST_WRITES_ENABLED = "true"
ARTIST_PRIVACY_VERSION = "2026-10-PHASE2-V5"

# ---------------------------------------------------------------------------
# PLOTART FOUNDING 25 APPLICATIONS · CLOSED. v2 prepared 28 Oct 2026 (founder
# implementation authorisation: build and test; production deployment and
# public activation NOT approved). A separate route
# (/v1/art-space-register/founding-25), switch and privacy version. It writes
# nothing until BOTH are set, AND the 'Founding 25 applications' table and the
# 'founding_25' register options exist in the base
# (airtable-schema-founding-25.proposed.json), AND the founder approves opening.
# Optional, set only on approval:
#   F25_DAILY_CAP          new applications per rolling 24 h (default 50, 1-500)
#   F25_TURNSTILE_SECRET   wrangler secret put F25_TURNSTILE_SECRET (bot challenge)
# Emergency close without a commit:
#   npx wrangler deploy --var F25_WRITES_ENABLED:false
# ---------------------------------------------------------------------------
F25_WRITES_ENABLED = "false"
F25_PRIVACY_VERSION = ""

# AIRTABLE_BASE and AIRTABLE_TOKEN are NOT set here and are NOT the garden ones.
# BOTH ARE PERSISTENT SECRETS (corrected 13 Oct 2026, activation preparation):
#   AIRTABLE_BASE  -> wrangler secret put AIRTABLE_BASE
#                     the "PlotNua Art Space Register" base id (created 13 Oct
#                     2026; recorded in governance/ART-SPACE-REGISTER-BUILD-2026-10-13.md
#                     §11.9 and airtable-schema.json, never in this file: guard S6)
#   AIRTABLE_TOKEN -> wrangler secret put AIRTABLE_TOKEN
#                     a token scoped to the art base alone
# Not a deploy-time `--var`: vars passed with --var last only for that deploy,
# so the next plain `wrangler deploy` (for example, switching writes back off)
# would silently drop the base. Secrets persist across deploys.
# writesEnabled() requires the switch, the token and the base, so a missing
# secret is a hard stop.
#
# Writes are now set in this file (opening, 14 Oct 2026). A plain
# `npx wrangler deploy` deploys exactly what this file says.

# ---------------------------------------------------------------------------
# REQUEST LOGGING OFF (founder decision R3, 13 Oct 2026). Cloudflare's
# documentation is inconsistent on whether "Workers Logs" is on by default for
# new Workers; this makes the setting explicit and governed. With it off,
# Cloudflare keeps no invocation logs (request details) for this Worker in
# Workers Logs. The code itself logs nothing (no console calls, no IP, no
# user agent). Takes effect on the next `npx wrangler deploy` (writes stay off).
# ---------------------------------------------------------------------------
[observability]
enabled = false

# ---------------------------------------------------------------------------
# ISOLATED TEST ENVIRONMENT (28 Oct 2026). A SEPARATE Worker name, used only
# with `--env test` and a SEPARATE test base holding synthetic data. It never
# accepts plotnua.ie: its origin is a local test page. The Host and Artist
# routes are off here. Plain `npx wrangler deploy` NEVER deploys this block,
# and the release scripts never pass --env test. Deploying it at all needs
# separate founder approval (test step T1).
# ---------------------------------------------------------------------------
[env.test]
name = "plotnua-art-space-register-f25-test"
workers_dev = true
preview_urls = false

[env.test.vars]
WRITES_ENABLED = "false"
EMAIL_ENABLED = "false"
ARTIST_WRITES_ENABLED = "false"
ARTIST_PRIVACY_VERSION = ""
PRIVACY_VERSION = ""
ORIGIN = "http://localhost:8790"
F25_WRITES_ENABLED = "true"
F25_PRIVACY_VERSION = "TEST-ONLY-NOT-A-PUBLISHED-NOTICE"
F25_DAILY_CAP = "3"

[env.test.observability]
enabled = false
